[project]
name = "switchboard"
version = "0.1.0"
description = "Bridges a phone call to KC's Claude Code sessions. README.md is how it is set up."
requires-python = ">=3.14"
dependencies = []

[project.scripts]
switchboard = "switchboard.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
