# The loop's settings for agent-workflow, read by the `loop` command from this same repo.
# The fixed design is ~/.claude/skills/setup-loop/loop.md. docs/agents/loop.md gives the rest.
name = "agent-workflow"
main_branch = "main"
tools = ["make", "uv", "npm"]
agent_hint = "The gate is `make check`. Run shellcheck as `uvx --from shellcheck-py shellcheck`."

[tracker]
kind = "jira"
url = "https://kcgbarbosa.atlassian.net"
in_progress = "In Progress"
landed = "In Review"
name_landed_keys_only = true

[agent]
model = "claude-opus-5-5"
effort = "high"

[limits]
parallel = 1
agent_timeout_minutes = 90
fix_attempts = 2
circuit_breaker = 2

[notify]
url = "https://ntfy.sh"

[watch]
# The same plan history as Pitchridge, since the plan belongs to the account.
plans = [
  { plan = "pro", since = 2026-10-01 },
  { plan = "max-5x", since = 2026-10-14T16:48:00Z },
]

[secrets]
# Shared with Pitchridge: the same Jira account, ntfy topic, and loop Claude account.
JIRA_EMAIL = { item = "pitchridge-jira", field = "username" }
JIRA_API_TOKEN = { item = "pitchridge-jira", field = "password" }
NTFY_TOPIC = { item = "pitchridge-ntfy-topic", field = "password" }
CLAUDE_CODE_OAUTH_TOKEN = { item = "pitchridge-loop-claude-token", field = "password" }

# The shared gate's settings. actions/review/action.yml in agent-workflow gives the [review] keys, and
# actions/judge/action.yml gives `blocking`, which goes in the repo's [ui] table.
[review]
enabled = true
