# The loop's settings for agent-workflow, read by the `loop` command from this same repo.
# The fixed design is ~/.claude/skills/setup-loop/loop.md. docs/agents/loop.md gives the rest.
name = "agent-workflow"
main_branch = "main"
tools = ["make", "uv", "npm"]
agent_hint = "The gate is `make check` once the Makefile exists, and the root, loop, and switchboard checks before that. Run shellcheck as `uvx --from shellcheck-py shellcheck`."

[tracker]
kind = "jira"
url = "https://kcgbarbosa.atlassian.net"
in_progress = "In Progress"
landed = "In Review"
name_landed_keys_only = true

[agent]
model = "claude-opus-5-5"
effort = "high"

[gates]
# One command before and after the repo has a Makefile. The loop runs a gate with no shell, hence `bash -c`.
ticket = ["bash", "-c", "if [ -f Makefile ]; then make check; else uv run --no-project --with pytest pytest tests && (cd loop && uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest) && (cd switchboard && uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest) && uvx --from shellcheck-py shellcheck install.sh .github/scripts/*.sh; fi"]
merge = ["bash", "-c", "if [ -f Makefile ]; then make check; else uv run --no-project --with pytest pytest tests && (cd loop && uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest) && (cd switchboard && uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest) && uvx --from shellcheck-py shellcheck install.sh .github/scripts/*.sh; fi"]
timeout_minutes = 15

[limits]
parallel = 1
agent_timeout_minutes = 90
fix_attempts = 2
circuit_breaker = 2

[notify]
url = "https://ntfy.sh"

[watch]
# The same plan history as Pitchridge, since the plan belongs to the account.
plans = [
  { plan = "pro", since = 2026-10-01 },
  { plan = "max-5x", since = 2026-10-14T16:48:00Z },
]

[secrets]
# Shared with Pitchridge: the same Jira account, ntfy topic, and loop Claude account.
JIRA_EMAIL = { item = "pitchridge-jira", field = "username" }
JIRA_API_TOKEN = { item = "pitchridge-jira", field = "password" }
NTFY_TOPIC = { item = "pitchridge-ntfy-topic", field = "password" }
CLAUDE_CODE_OAUTH_TOKEN = { item = "pitchridge-loop-claude-token", field = "password" }

# The gate and the new loop read the keys below. Today's loop refuses a key it does not know,
# so they stay comments until the new loop ships. `blocking` goes in the repo's [ui] table.
# [review]
# enabled = false
#
# [ui]
# blocking = []
