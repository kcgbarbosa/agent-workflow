<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<title>My Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* The look is the start page's: its ground, surfaces, type, cards, and state colours, with the run blue as the
   brand where the start page has evergreen, so the two pages read as one family and tell apart at a glance. Green
   marks only what is ok. The page is light or dark as the system is set. */
/* Copied from the start page, chezmoi source dot_local/share/start/index.html in the machines repo: its :root and
   dark blocks, and its .dot, .track and .issue shapes. Only --brand, --brand-ink and --hero differ: the run blue.
   A restyle of either page changes both. */
:root {
  color-scheme: light dark;
  --ground: #f4f2ec;
  --surface: #ffffff;
  --stage: #ebe7dc;
  --text: #16201c;
  --muted: #5f6259;
  --quiet: #8a8b82;
  --brand: #2856c8;
  --brand-ink: #2856c8;
  --hero: #2856c8;
  --inv-text: #f3efe6;
  --inv-muted: #c9d6cd;
  --ok: #3f9a68;
  --warn: #e0a128;
  --warn-ink: #9a5a12;
  --bad: #c4432b;
  --soft: 0 1px 2px rgba(22, 32, 28, .04), 0 18px 40px -24px rgba(22, 32, 28, .22);
  --lift: 0 2px 4px rgba(22, 32, 28, .05), 0 28px 48px -24px rgba(22, 32, 28, .3);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
  /* The side gutter, which clears the rounded corners and the sensor in landscape. */
  --gutter-l: max(clamp(16px, 4vw, 64px), env(safe-area-inset-left));
  --gutter-r: max(clamp(16px, 4vw, 64px), env(safe-area-inset-right));
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0f1512;
    --surface: #18201c;
    --stage: #202a25;
    --text: #f3efe6;
    --muted: #b4c0b8;
    --quiet: #7e8a83;
    --brand: #6f97ff;
    --brand-ink: #6f97ff;
    --hero: #1d3a8a;
    --warn-ink: #e8b65a;
    --bad: #f0765e;
    --soft: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 40px -24px rgba(0, 0, 0, .6);
    --lift: 0 2px 4px rgba(0, 0, 0, .3), 0 28px 48px -24px rgba(0, 0, 0, .7);
  }
}
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--quiet); }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
/* The start page pulses in green. Here a running card pulses in the accent, since green means only ok. */
.dot.pulse { background: var(--brand); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.track { height: 6px; border-radius: 99px; background: var(--stage); overflow: hidden; }
.track > span { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--brand); transition: width 600ms var(--ease); }
.track > span.warn { background: var(--warn); } .track > span.bad { background: var(--bad); }
.issue { margin-top: 10px; padding: 8px 12px; border-radius: 12px; background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn-ink); font-size: 13px; line-height: 1.35; }
.issue.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
/* The page's own rules from here on. */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--text); font: 400 14px/20px var(--sans); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--brand) 18%, transparent); color: var(--text); }
a { color: var(--brand-ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--brand); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
code { font-family: var(--mono); font-size: 12.5px; background: var(--stage); padding: 1px 6px; border-radius: 6px; color: var(--text); }
.muted { color: var(--muted); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
@media (prefers-reduced-motion: reduce) { *, ::before, ::after { transition: none !important; animation: none !important; } }

/* --- Top bar: home, the run, and its menu --- */
header { position: sticky; top: 0; z-index: 5; background: var(--ground); border-bottom: 1px solid transparent; transition: border-color 160ms; }
header.scrolled { border-bottom-color: var(--stage); }
.bar { display: flex; align-items: center; gap: 12px; height: 56px; }
.homelink { display: inline-flex; align-items: center; justify-content: center; flex: none; min-width: 36px; min-height: 36px; padding: 6px 8px; border-radius: 12px; color: var(--text); text-decoration: none; }
.homelink:hover { background: var(--stage); }
.homelink svg { width: 20px; height: 20px; }
.ctx { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: 0 1 auto; overflow: hidden; white-space: nowrap; }
.ctx .slash { color: var(--quiet); }
.ctx b { font-weight: 550; }
body.at-home .ctx { display: none; }
@media (max-width: 520px) { .ctx .project, .ctx .slash { display: none; } }
.compact-title { display: none; }
.run { display: flex; align-items: center; gap: 12px; margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
/* The plan meter's one line on the home header. */
.meterline b { color: var(--text); font-weight: 550; }
.meterline .warn { color: var(--warn-ink); } .meterline .bad { color: var(--bad); }
/* A run's views and its Epic picker, behind one button. */
.menu { position: relative; flex: none; }
body.at-home .menu { display: none; }
.menu > button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 0; border-radius: 99px; background: var(--surface); box-shadow: var(--soft); font-weight: 500; }
.menu > button svg { width: 18px; height: 18px; }
.menu > button[aria-expanded="true"] { box-shadow: var(--lift); }
.menulist { position: absolute; right: 0; top: calc(100% + 8px); z-index: 7; width: min(320px, calc(100vw - 32px)); padding: 8px; background: var(--surface); border-radius: 24px; box-shadow: var(--lift); }
.menulist[hidden] { display: none; }
.menulist a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; color: var(--text); text-decoration: none; font-weight: 500; }
.menulist a:hover { background: var(--stage); }
.menulist a.on { color: var(--brand-ink); background: color-mix(in srgb, var(--brand) 12%, transparent); }
.menulist a svg { width: 18px; height: 18px; }
.menulist label { display: grid; gap: 4px; margin: 8px 4px 4px; padding-top: 10px; border-top: 1px solid var(--stage); color: var(--muted); font-size: 12px; }
.menulist select { width: 100%; padding: 8px 10px; border: 1px solid var(--stage); border-radius: 12px; background: var(--ground); font-size: 14px; }
@media (max-width: 1023px) {
  .bar { height: 52px; gap: 8px; }
  .run .last { display: none; }
  /* The large title has scrolled away, so the bar names the page. */
  header.scrolled .ctx { display: none; }
  header.scrolled .compact-title { display: block; flex: 1; min-width: 0; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}

/* --- Page --- */
main.wrap { padding-top: 8px; padding-bottom: calc(48px + env(safe-area-inset-bottom)); display: grid; gap: 24px; }
@media (max-width: 1023px) { main.wrap { gap: 16px; } }
.pagehead { padding: 16px 0 4px; }
.pagehead h1 { margin: 4px 0 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
@media (max-width: 1023px) { .pagehead h1 { font-size: 34px; line-height: 40px; font-weight: 650; letter-spacing: -0.02em; } }
.panel { background: var(--surface); border-radius: 24px; box-shadow: var(--soft); min-width: 0; }
.phead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 20px 24px 0; }
.phead h2 { margin: 0; font-size: 17px; line-height: 22px; font-weight: 600; }
.phead .aside { color: var(--muted); }
.pbody { padding: 16px 24px 24px; }
@media (max-width: 1023px) { .phead { padding: 16px 16px 0; } .pbody { padding: 12px 16px 16px; } }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }

/* A status tile: the only place a category color shows. */
.tile { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; line-height: 18px; font-weight: 500; white-space: nowrap; background: var(--stage); color: var(--muted); }
.tile.lit::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tile.run { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand-ink); }
.tile.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.tile.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn-ink); }
.tile.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.tile.plain { background: var(--stage); color: var(--text); }

/* --- Overview: the figures --- */
.metrics { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 759px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .metrics > :first-child { grid-column: 1 / -1; } }
.metric { padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 759px) { .metric { padding: 16px; } }
.metric h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--muted); }
.figure { font-variant-numeric: tabular-nums; color: var(--muted); }
.figure b { font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); margin-right: 6px; }
.figure.na b { font-size: 17px; line-height: 32px; color: var(--muted); }
.metric .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* --- Overview: the work queue --- */
.work { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1024px) { .work { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
@media (max-width: 1023px) { .work { gap: 16px; } }
.group + .group { margin-top: 24px; }
.group > h3 { margin: 0 0 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.current { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--stage); border-radius: 12px; padding: 16px; transition: border-color 160ms; }
.current + .current { margin-top: 12px; }
.current:hover { border-color: var(--quiet); }
.current .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.key { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }
.current .title { font-size: 16px; line-height: 22px; font-weight: 550; margin: 4px 0 14px; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 14px 0 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.facts .toolname { color: var(--muted); font-weight: 500; margin-right: 6px; }
.why { margin-top: 12px; color: var(--warn-ink); }
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.stepper .st { font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper .st::before { content: ""; display: block; height: 3px; border-radius: 99px; background: var(--stage); margin-bottom: 6px; }
.stepper .st.past::before { background: var(--quiet); }
.stepper .st.now { color: var(--text); font-weight: 500; }
.stepper .st.now::before { background: var(--text); }
.stepper .st.now.paused { color: var(--warn-ink); }
.stepper .st.now.paused::before { background: var(--warn); }
@media (max-width: 520px) { .stepper .st { font-size: 11px; } }
.note { padding: 16px; border-radius: 12px; background: var(--ground); color: var(--muted); }
.note b { color: var(--text); font-weight: 550; }
.list { list-style: none; margin: 0; padding: 0; }
.list button, .list a.row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--stage); padding: 12px 4px; min-height: 44px; }
.list a.row { color: inherit; text-decoration: none; }
.list li:first-child button, .list li:first-child a.row { border-top: 0; }
.list button:hover .what > div:first-child, .list a.row:hover .what > div:first-child { text-decoration: underline; text-decoration-color: var(--quiet); text-underline-offset: 3px; }
.list .n { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.list .what { min-width: 0; }
.list .what > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .rowreason { margin-top: 2px; color: var(--muted); white-space: normal !important; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.more { margin-top: 8px; color: var(--muted); }

/* --- Home: the page name, a card per project, and the log --- */
.host { margin: 16px 0 8px; font-size: clamp(72px, 10vw, 152px); line-height: .78; font-weight: 650; letter-spacing: -0.07em; color: var(--brand-ink); }
.cards { display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); align-items: start; }
@media (max-width: 1023px) { .cards { gap: 16px; } }
.card { position: relative; display: grid; gap: 14px; padding: 22px 24px 24px; background: var(--surface); border-radius: 30px; box-shadow: var(--soft); transition: box-shadow 280ms var(--ease), transform 280ms var(--ease); }
.card:hover { box-shadow: var(--lift); transform: translateY(-3px); }
.card .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card .name { font-size: 24px; line-height: 1.05; font-weight: 560; letter-spacing: -0.04em; color: var(--text); text-decoration: none; }
/* The whole card opens the project's current run. Its own links sit above that. */
.card a.name::after { content: ""; position: absolute; inset: 0; border-radius: 30px; }
.card a:not(.name) { position: relative; z-index: 1; }
.card .state { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
.card .epic { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .epic b { color: var(--text); font-weight: 550; }
.card .sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 8px; }
.card .issue { margin-top: 0; display: grid; gap: 2px; }
.card .issue a { color: inherit; font-weight: 550; }
.card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.card li { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.card li .t { color: var(--muted); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 0; border-radius: 99px; padding: 4px 12px; background: var(--stage); color: var(--muted); font-size: 13px; font-weight: 500; }
.chips button.on { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand-ink); }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--stage); }
.log li:first-child { border-top: 0; }
.log .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.log .what { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.log .what b { font-weight: 550; }
.log .chip { padding: 0 8px; border-radius: 99px; background: var(--stage); color: var(--muted); font-size: 12px; line-height: 18px; }
.log .d { grid-column: 2; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.textbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-decoration-color: var(--quiet); text-underline-offset: 3px; }
.textbtn:hover { color: var(--text); text-decoration-color: var(--text); }
.list.needs a.row { grid-template-columns: minmax(0, 1fr) auto; }
.metric .sub a { color: var(--muted); }

/* --- Tickets --- */
table.tickets { width: 100%; border-collapse: collapse; }
table.tickets th { text-align: left; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted); padding: 0 12px 10px; border-bottom: 1px solid var(--stage); }
table.tickets td { padding: 14px 12px; border-bottom: 1px solid var(--stage); vertical-align: top; }
table.tickets tr:last-child td { border-bottom: 0; }
table.tickets tbody tr { cursor: pointer; }
table.tickets tbody tr:hover td { background: var(--ground); }
table.tickets td.t { overflow-wrap: anywhere; font-weight: 500; }
table.tickets td.t .key { display: block; }
@media (max-width: 760px) { table.tickets .opt { display: none; } }

/* --- Ticket and run detail --- */
.detail-head { padding: 20px 24px; display: grid; gap: 16px; }
@media (max-width: 1023px) { .detail-head { padding: 16px; } }
.facts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px 24px; margin: 0; }
.facts-grid div { min-width: 0; }
.facts-grid dt { color: var(--muted); }
.facts-grid dd { margin: 2px 0 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.outcome { display: grid; gap: 6px; padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--ok) 16%, transparent); overflow-wrap: anywhere; }
.outcome.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); }
.outcome p { margin: 0; white-space: pre-wrap; }
.outcome ul { margin: 0; padding-left: 18px; }
details.output > summary { cursor: pointer; padding: 12px 24px; color: var(--muted); }
@media (max-width: 1023px) { details.output > summary { padding: 12px 16px; } }
.reason { padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.segments { display: flex; gap: 4px; padding: 0 16px; border-top: 1px solid var(--stage); border-bottom: 1px solid var(--stage); overflow-x: auto; }
.segments button { background: none; border: 0; padding: 12px 8px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.segments button:hover { color: var(--text); }
.segments button.on { color: var(--brand-ink); border-bottom-color: var(--brand-ink); }
.body { padding: 16px 24px 24px; }
@media (max-width: 1023px) { .body { padding: 12px 16px 16px; } }
.runs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.runs button { background: var(--surface); border: 1px solid var(--stage); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.runs button.on { background: color-mix(in srgb, var(--brand) 12%, transparent); border-color: var(--brand-ink); }
.runs label { margin-left: auto; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.runs input { accent-color: var(--text); }
.feed { max-height: calc(100vh - 300px); min-height: 200px; overflow-y: auto; border-top: 1px solid var(--stage); }
@media (max-width: 1023px) { .feed { max-height: 70vh; } }
.item { border-bottom: 1px solid var(--stage); padding: 7px 2px; }
.item.sub { margin-left: 18px; padding-left: 10px; border-left: 2px solid var(--stage); }
.tool { display: flex; gap: 10px; align-items: baseline; cursor: pointer; min-width: 0; }
.tool .name { color: var(--muted); font-weight: 500; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .mark { flex: none; width: 16px; text-align: center; }
.mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); } .mark.wait { color: var(--quiet); }
.item.denied { background: color-mix(in srgb, var(--bad) 14%, transparent); }
.item.denied .what::before { content: "Denied by auto mode: "; color: var(--bad); font-weight: 550; }
pre.detail { margin: 8px 0 2px; padding: 10px 12px; background: var(--ground); border: 1px solid var(--stage); border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/18px var(--mono); max-height: 360px; overflow: auto; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.text.open { display: block; }
.divider { font-size: 12px; color: var(--muted); padding: 8px 2px; border-bottom: 1px solid var(--stage); }
.verdict { margin: 8px 0; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--ok) 16%, transparent); }
.verdict.blocked { background: color-mix(in srgb, var(--bad) 14%, transparent); }
.verdict ul { margin: 6px 0 0; padding-left: 18px; }
.steps { width: 100%; border-collapse: collapse; }
.steps td { padding: 10px 8px; border-bottom: 1px solid var(--stage); vertical-align: top; }
.steps tr:last-child td { border-bottom: 0; }
.steps td.t { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.steps td.k { white-space: nowrap; color: var(--muted); }
.steps td.s { white-space: nowrap; }
.steps td.s b { font-weight: 550; margin-right: 6px; }
.steps td.d { color: var(--muted); overflow-wrap: anywhere; }
@media (max-width: 820px) { .steps td.k { display: none; } .steps td.s { white-space: normal; } }
.cost td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cost td.n.txt { white-space: normal; overflow-wrap: anywhere; }
.cost tr.sec td { padding-top: 20px; font-size: 12px; font-weight: 500; color: var(--muted); }
.cost td.up { color: var(--bad); } .cost td.down { color: var(--ok); }
@media (max-width: 520px) { .cost td { padding: 8px 4px; font-size: 13px; } }
.files a { display: block; padding: 4px 0; overflow-wrap: anywhere; }

/* --- Usage --- */
.usage-grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .usage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1023px) { .usage-grid { gap: 16px; } }
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; }
.figs div { color: var(--muted); }
.figs b { display: block; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.figs + .figs { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--stage); }
.meter + .meter { margin-top: 20px; }
.meter .row1 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.meter .row1 b { font-weight: 550; }
.meter .when { margin-top: 6px; color: var(--muted); font-size: 13px; }
.fine { margin-top: 16px; color: var(--muted); font-size: 13px; }
/* This run's share of the 5-hour window per merged ticket against the typical share, under the meter bars. */
.share { margin-top: 20px; font-variant-numeric: tabular-nums; }
.share.warn { color: var(--warn-ink); font-weight: 550; }
/* The rest of the usage view: one closed fold, opened when you plan, so the view stays short. */
details.fold > summary { list-style: none; cursor: pointer; padding: 8px 0; color: var(--muted); font-weight: 500; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸ "; }
details.fold[open] > summary::before { content: "▾ "; }
details.fold > .usage-grid { margin-top: 8px; }
.forecast h3 { margin: 24px 0 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.forecast .scroll { overflow-x: auto; }
.forecast .scroll td:first-child { min-width: 150px; }

</style>

// --- Helpers ---
function h(tag, props, ...children) {

// --- Routing: #/ is home, then #/<project>/<Epic>/<view or ticket> ---
function readHash() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  // An address from before projects names the Epic first, and opens that Epic of this repo's project.
  if (parts[0] && KEY.test(parts[0])) parts.unshift("");
  const [project, epic, page] = parts;
  ui.project = project || null;
  ui.epic = epic || null;

async function route() {
  const before = `${ui.project}/${ui.epic}/${ui.page}/${ui.ticket}`;
  readHash();
  drawHomeLink();
  if (`${ui.project}/${ui.epic}/${ui.page}/${ui.ticket}` !== before) { ui.agent = null; ui.feed = null; ui.tab = null; window.scrollTo(0, 0); }
  ui.drawn = null;
  closeMenu();
  await refresh();
}

// --- Data: every figure comes from one poll, and a poll redraws only when something changed ---
async function refresh() {
  if (ui.page === "home") return refreshHome();
  let projects;
  try { [projects, ui.usage] = await Promise.all([getJson("/api/home"), getJson("/api/usage")]); } catch { return; }
  // An address with no project, as from before projects, keeps its Epic and its view in this repo's project.
  if (!ui.project) { go(ui.ticket || ui.page, projects[0].name, ui.epic); return; }
  const project = projects.find((p) => p.name === ui.project);
  if (!project) { go("", null, null); return; }
  ui.epics = project.runs;
  renderContext();
  if (!ui.epics.length) {
    ui.view = null;
    document.getElementById("run").replaceChildren();
    renderMenu("");
    document.getElementById("main").replaceChildren(h("div", { class: "panel empty" }, "No runs of this project on this host yet. ", h("code", {}, "loop start <Epic key>"), " starts one."));
    return;
  }
  if (!ui.epic || !ui.epics.some((e) => e.key === ui.epic)) {
    const running = ui.epics.find((e) => e.running);
    go("", ui.project, (running || ui.epics[0]).key);
    return;
  }
  try { ui.view = await getJson(api(`/api/epic/${ui.epic}`)); } catch { return; }
  if (ui.page === "usage") loadReport();
  if (ui.page === "usage" && ui.moreOpen) loadForecast();
  const drawn = JSON.stringify([ui.view, ui.usage, ui.page, ui.ticket, Math.floor(Date.now() / AGE_MS)]);
  if (drawn !== ui.drawn) { ui.drawn = drawn; render(); }
  else if (ui.feed && ui.feed.live) pollFeed();
}

// Inside a run, the bar names the project and the Epic. A card on the home page is the way to another project.
function renderContext() {
  document.getElementById("ctx").replaceChildren(h("span", { class: "project" }, ui.project), h("span", { class: "slash" }, "/"), h("b", {}, ui.epic || ""));
}

});
menuList.addEventListener("click", (e) => { if (e.target.closest("a")) closeMenu(); });
document.addEventListener("click", (e) => { if (!menuList.hidden && !e.target.closest("#menu")) closeMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menuList.hidden) { closeMenu(); menuButton.focus(); } });

// The menu redraws only when what it lists changed, so a poll does not close an open Epic picker.
function renderMenu(active) {
  const drawn = JSON.stringify([active, ui.project, ui.epic, ui.epics.map((e) => [e.key, e.summary, e.running])]);
  if (drawn === ui.menu) return;
  ui.menu = drawn;
  const label = (VIEWS.find(([k]) => k === active) || VIEWS[0])[1];
  menuButton.replaceChildren(icon(ICONS.menu[0]), label);
  const views = ui.epic ? VIEWS.map(([k, name]) =>
    h("a", { href: hashFor(ui.project, ui.epic, k), class: active === k ? "on" : "", "aria-current": active === k ? "page" : null },
      icon(ICONS[k][active === k ? 1 : 0]), name)) : [];
  const epic = h("select", { "aria-label": "Epic" }, ui.epics.map((e) => h("option", { value: e.key, selected: e.key === ui.epic },
    `${e.key}${e.summary ? ` · ${e.summary}` : ""}${e.running ? " (running)" : ""}`)));
  epic.onchange = () => { closeMenu(); go("", ui.project, epic.value); };
  menuList.replaceChildren(...views, ui.epics.length ? h("label", {}, "Epic", epic) : "");
}

// --- Home: a card per project on the host, then one log of what the loop did across them ---
async function refreshHome() {
  let home, log;
  try { [home, ui.usage] = await Promise.all([getJson("/api/home"), getJson("/api/usage")]); } catch { return; }
  if (!home.some((p) => p.name === ui.logProject)) ui.logProject = "";
  try { log = await getJson(ui.logProject ? `/api/log?project=${encodeURIComponent(ui.logProject)}` : "/api/log"); } catch { return; }
  ui.home = home;
  ui.log = log;
  const drawn = JSON.stringify([home, ui.usage, log, ui.logProject, ui.page, Math.floor(Date.now() / AGE_MS)]);
  if (drawn !== ui.drawn) { ui.drawn = drawn; renderHome(); }
}

function renderHome() {
  const needs = ui.home.filter((p) => p.state === "needs_kc").length;
  const running = ui.home.filter((p) => p.state === "running").length;
  document.title = needs ? `${needs} ${needs === 1 ? "needs" : "need"} you · My Loop` : running ? `${running} running · My Loop` : "My Loop";
  document.getElementById("ctx").replaceChildren();
  document.getElementById("run").replaceChildren(meterLine(ui.usage.five_hour));
  document.getElementById("main").replaceChildren(
    h("div", { class: "host", id: "title" }, "My Loop"),
    h("div", { class: "cards" }, ui.home.map(card)),
    logPanel());
  watchTitle();
}

// The 5-hour window on one line: its use and its reset time.
function meterLine(reading) {
  if (!reading) return h("span", { class: "meterline", title: "No agent on this host has reported the plan meter yet." }, "5-hour window: no reading");
  if (reading.past) return h("span", { class: "meterline" }, `5-hour window reset ${at(reading.resets_at)}`);
  const used = Math.round(reading.utilization * 100);
  const tone = used >= 90 ? "bad" : used >= 70 ? "warn" : "";
  return h("span", { class: "meterline", title: `Read ${ago(reading.read)}. The meter covers all use of the account, not only the loop.` },
    "5-hour ", h("b", { class: tone }, `${used}%`), typeof reading.resets_at === "number" ? ` · resets ${at(reading.resets_at)}` : "");
}

// A project's card opens its current run: the running one, else the newest.
function card(p) {
  const [label, tone] = STATE[p.state] || [p.state, ""];
  const href = p.current ? hashFor(p.name, p.current, "") : null;
  const top = h("div", { class: "top" },
    href ? h("a", { class: "name", href }, p.name) : h("span", { class: "name" }, p.name),
    h("span", { class: "state" }, h("span", { class: `dot ${tone}` }), label));
  const summary = (key) => h("div", { class: "epic" }, h("b", {}, key), p.epic.summary ? ` · ${p.epic.summary}` : "");
  if (!p.current) return h("section", { class: "card" }, top, h("div", { class: "sub" }, "No runs yet"));
  if (p.state === "idle") {
    return h("section", { class: "card" }, top,
      h("div", {}, summary(p.last.key), h("div", { class: "sub" }, `${(STATUS[p.last.status] || [p.last.status])[0]} · ${ago(p.last.at)}`)));
  }
  const { complete, total } = p.progress;
  const share = total ? Math.round((complete / total) * 100) : 0;
  return h("section", { class: "card" }, top,
    h("div", {}, summary(p.epic.key),
      h("div", { class: "track", style: "margin-top:10px" }, h("span", { style: `width:${share}%` })),
      h("div", { class: "sub" }, total ? `${complete} of ${plural(total, "ticket", "tickets")} complete` : "No tickets read yet")),
    ...p.needs_kc.map((n) => needsIssue(p, n)),
    p.working.length ? h("ul", {}, p.working.map((w) => h("li", {},
      h("span", {}, h("a", { href: hashFor(p.name, p.current, w.key) }, w.key), " ", stepName(w.step)),
      h("span", { class: "t", title: `In this step since ${when(w.since)}` }, since(w.since))))) : "");
}

// A row that needs KC links to its pull request, or to the ticket when it has none. A stopped run opens Diagnostics.
function needsIssue(p, n) {
  const href = n.pr || hashFor(p.name, p.current, n.kind === "stopped" ? "diagnostics" : n.ticket);
  const [label, tone] = NEEDS[n.kind] || [n.kind, ""];
  const reason = n.kind === "stopped" ? STOPPED[n.reason] || n.reason : n.reason;
  return h("div", { class: `issue${tone === "bad" ? " bad" : ""}` },
    h("a", { href, ...(n.pr ? { target: "_blank", rel: "noopener" } : {}) }, `${label} · ${n.ticket}`),
    reason ? h("div", {}, reason) : "");
}

// The log: the server's latest lines, newest first, each step and result in the words of the steps list.
function logPanel() {
  const chips = h("div", { class: "chips", role: "group", "aria-label": "Project" }, [["", "All"], ...ui.home.map((p) => [p.name, p.name])].map(([name, label]) =>
    h("button", { type: "button", class: ui.logProject === name ? "on" : "", "aria-pressed": String(ui.logProject === name),
      onclick: () => { ui.logProject = name; refreshHome(); } }, label)));
  const rows = ui.log.map((l) => h("li", {},
    h("span", { class: "t", title: `${when(l.time)}, ${ago(l.time)}` }, today(l.time) ? minute(l.time) : when(l.time)),
    h("span", { class: "what" },
      h("span", { class: "chip" }, l.project),
      KEY.test(l.ticket) && l.ticket !== l.epic ? h("a", { href: hashFor(l.project, l.epic, l.ticket) }, l.ticket) : h("span", { class: "key" }, l.ticket),
      h("b", {}, l.step), tile([l.result, RESULT[l.result] || ""]),
      l.pr ? prLink({ url: l.pr }) : ""),
    l.detail ? h("div", { class: "d" }, l.detail.slice(0, 400)) : ""));
  return h("section", { class: "panel" },
    h("div", { class: "phead" }, h("h2", {}, "Log")),
    h("div", { class: "pbody" }, chips, h("div", { style: "height:8px" }),
      rows.length ? h("ul", { class: "log" }, rows) : h("div", { class: "note" }, "No steps logged yet.")));
}

// The house icon is filled on the home page, as the active tab is.
function drawHomeLink() {
  const link = document.getElementById("home");
  const at = ui.page === "home";
  link.querySelector("svg")?.remove();
  link.prepend(icon(ICONS.home[at ? 1 : 0]));
  if (at) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
}

function render() {
  const v = ui.view;
  document.title = `${v.key} ${(STATUS[v.status] || [v.status])[0]} · My Loop`;
  renderRun(v);
  renderMenu(ui.page === "ticket" ? "tickets" : ui.page);
  const main = document.getElementById("main");
  if (ui.page === "ticket") renderTicket(v);
  else if (ui.page === "tickets") main.replaceChildren(pageHead("Tickets"), ticketList(v));
  else if (ui.page === "diagnostics") renderDiagnostics(v);
  else if (ui.page === "usage") main.replaceChildren(pageHead("Usage"), usageView(v));
  else main.replaceChildren(pageHead(v.summary || v.key), needsPanel(v), metrics(v), h("div", { class: "work" }, workQueue(v)));
  watchTitle();
}

function pageHead(title) {
  return h("div", { class: "pagehead" }, h("h1", { id: "title" }, title));
}

// The large title shrinks into the bar once it scrolls away.
let titleWatch = null;
function watchTitle() {
  const title = document.getElementById("title");
  document.getElementById("compact").textContent = title ? title.textContent : "";
  if (titleWatch) titleWatch.disconnect();
  if (!title) return;
  titleWatch = new IntersectionObserver(([entry]) => {
    document.getElementById("top").classList.toggle("scrolled", !entry.isIntersecting && entry.boundingClientRect.top < 60);
  }, { rootMargin: "-56px 0px 0px 0px" });
  titleWatch.observe(title);
}

function renderRun(v) {
  const last = v.events[v.events.length - 1];
  const until = v.resumes ? new Date(v.resumes).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : null;
  const [label, tone] = STATUS[v.status] || [v.status, ""];
  document.getElementById("run").replaceChildren(
    last ? h("span", { class: "last", title: `${last.ticket} ${last.step} ${last.result}` }, `Last step ${ago(last.time)}`) : "",
    h("span", { title: v.stop_reason || "" }, tile([until ? `${label} until ${until}` : label, tone], true)));
}

// --- Overview: the figures ---
function metric(label, value, extra) {
  return h("section", { class: "panel metric" }, h("h2", {}, label), value, extra);
}

function metrics(v) {
  const { complete, total } = v.progress;
  const share = total ? Math.round((complete / total) * 100) : 0;
  const progress = metric("Epic progress",
    h("div", { class: "figure" }, h("b", {}, String(complete)), `of ${plural(total, "ticket", "tickets")}`),
    [h("div", { class: "track" }, h("span", { style: `width:${share}%` })),
      h("div", { class: "sub", title: "A ticket is complete when its pull request has merged, or it was done in the tracker before." }, `${share}% complete`)]);
  return h("div", { class: "metrics" }, progress, ...WINDOWS.map(([w, label]) => usageCard(label, ui.usage[w])));
}

function usageCard(label, reading) {
  if (!reading) {
    return metric(label, h("div", { class: "figure na" }, h("b", {}, "Unavailable")),
      h("div", { class: "sub" }, "No agent on this host has reported the plan meter yet. The API cost does not stand in for it."));
  }
  if (reading.past) {
    return metric(label, h("div", { class: "figure na" }, h("b", {}, "Unknown since reset")),
      h("div", { class: "sub" }, `The window reset ${at(reading.resets_at)}, and no agent has read the meter since.`));
  }
  const used = Math.round(reading.utilization * 100);
  const tone = used >= 90 ? "bad" : used >= 70 ? "warn" : "";
  const reset = typeof reading.resets_at === "number" ? `resets in ${length((reading.resets_at * 1000 - Date.now()) / 60000)}` : "";
  return metric(label, h("div", { class: "figure" }, h("b", {}, `${used}%`), "used"), [
    h("div", { class: "track" }, h("span", { class: tone, style: `width:${Math.min(used, 100)}%` })),
    h("div", { class: "sub", title: `Read ${ago(reading.read)}. The meter covers all use of the account, not only the loop.${typeof reading.resets_at === "number" ? ` It resets ${at(reading.resets_at)}.` : ""}` },
      [`${Math.max(0, 100 - used)}% left`, reset].filter(Boolean).join(" · "))]);
}

// --- Overview: what needs KC ---
// A row opens its pull request, or the ticket view when it has none. A stopped run opens Diagnostics.
function needsPanel(v) {
  const byKey = Object.fromEntries(v.tickets.map((t) => [t.key, t]));
  const rows = v.needs_kc.map((n) => {
    const href = n.pr || hashFor(ui.project, ui.epic, n.kind === "stopped" ? "diagnostics" : n.ticket);
    const summary = n.kind === "stopped" ? "The run" : byKey[n.ticket]?.summary || "";
    const reason = n.kind === "stopped" ? STOPPED[n.reason] || n.reason : n.reason;
    return h("li", {}, h("a", { class: "row", href, ...(n.pr ? { target: "_blank", rel: "noopener" } : {}) },
      h("span", { class: "what" }, h("div", {}, h("span", { class: "key" }, n.ticket), " ", summary),
        reason ? h("div", { class: "rowreason" }, reason) : ""),
      tile(NEEDS[n.kind] || [n.kind, ""])));
  });
  return h("section", { class: "panel" },
    h("div", { class: "phead" }, h("h2", {}, "Needs you")),
    h("div", { class: "pbody" }, rows.length ? h("ul", { class: "list needs" }, rows) : h("div", { class: "note" }, "Nothing needs you")));
}

// --- Overview: the work queue ---
function workQueue(v) {
  const working = v.tickets.filter((t) => t.column === "running");
  const stopped = v.tickets.filter((t) => t.column === "stopped");
  const byKey = Object.fromEntries(v.tickets.map((t) => [t.key, t]));
  const groups = [h("div", { class: "group" }, h("h3", {}, "Currently working"), working.length ? working.map(currentCard) : stateNote(v))];
  if (stopped.length) groups.push(h("div", { class: "group" }, h("h3", {}, "Stopped mid-step"), stopped.map(currentCard)));
  if (v.queue.length) {
    groups.push(h("div", { class: "group" }, h("h3", {}, "Up next"), h("ul", { class: "list" }, v.queue.slice(0, QUEUE_SHOWN).map((q, i) => {
      const t = byKey[q.key];
      const label = q.state === "ready" ? "Ready" : `${q.state === "blocked" ? "Blocked by" : "Waits on"} ${q.waits_on.join(", ")}`;
      return h("li", {}, h("button", { onclick: () => go(q.key) }, h("span", { class: "n" }, `${i + 1}`),
        h("span", { class: "what" }, h("div", {}, h("span", { class: "key" }, q.key), " ", t.summary)),
        tile([label, QUEUE[q.state][1]])));
    })), v.queue.length > QUEUE_SHOWN ? h("div", { class: "more" }, `${v.queue.length - QUEUE_SHOWN} more after these`) : ""));
  }
  return h("section", { class: "panel" },
    h("div", { class: "phead" }, h("h2", {}, "Work queue"), h("a", { class: "aside", href: hashFor(ui.project, ui.epic, "tickets") }, "All tickets")),
    h("div", { class: "pbody" }, groups));
}

function stepper(step) {
  const now = STEPS.findIndex(([k]) => k === step.name);
  return h("div", { class: "stepper" }, STEPS.map(([k, label], i) =>
    h("div", { class: `st${i < now ? " past" : ""}${i === now ? " now" : ""}${i === now && step.paused ? " paused" : ""}` }, label)));
}

function currentCard(t) {
  const step = t.step || { name: null, since: null, paused: false };
  const health = t.health || { state: "on-track", reason: "" };
  const state = t.column === "stopped" ? COLUMN.stopped : step.paused ? ["Paused", "warn"] : HEALTH[health.state];
  const latest = (t.recent || [])[t.recent.length - 1];
  const output = t.agents.length ? t.agents[t.agents.length - 1].updated : null;
  return h("button", { class: "current", onclick: () => go(t.key) },
    h("div", { class: "top" }, h("span", { class: "key" }, t.key), tile(state, true)),
    h("div", { class: "title" }, t.summary || ""),
    stepper(step),
    h("dl", { class: "facts" },
      h("dt", {}, t.column === "stopped" ? "Stopped in" : "Stage"), h("dd", {}, step.name ? `${stepName(step.name)}${step.since ? ` · ${since(step.since)}` : ""}` : "Between steps"),
      h("dt", {}, "Latest activity"), h("dd", { title: latest ? latest.summary || latest.text : "" },
        latest ? [latest.kind === "tool" ? h("span", { class: "toolname" }, latest.tool) : "", latest.summary || latest.text] : h("span", { class: "muted" }, "No agent output yet")),
      h("dt", {}, "Last agent output"), h("dd", {}, output ? ago(output) : "-"),
      step.name === "wait" && t.pr ? [h("dt", {}, "Checks"), h("dd", {}, checksTile(t.pr), failedChecks(t.pr).length ? [" ", ...checkNames(failedChecks(t.pr))] : "")] : "",
      t.stacked_on ? [h("dt", {}, "Stacked on"), h("dd", {}, h("code", {}, t.stacked_on.branch), t.stacked_on.pr ? ` ${prNumber(t.stacked_on.pr)}` : "")] : ""),
    health.reason ? h("div", { class: "why" }, health.reason) : "");
}

function stateNote(v) {
  const said = {
    running: "The run is between tickets. The next one starts shortly.",
    paused: "The run is paused for the usage limit.",
    completed: "Every ticket is complete.",
    blocked: STOPPED[v.stop_reason] || "The run stopped. A stuck ticket needs you.",
    failed: STOPPED["loop-error"],
    stopped: STOPPED[v.stop_reason] || `The run stopped: ${v.stop_reason}.`,
    idle: ["The loop is not running. ", h("code", {}, `loop start ${v.key}`), " starts it."],
  }[v.status];
  const stop = v.events.slice().reverse().find((e) => e.ticket === v.key && e.step === "stop");
  return h("div", { class: "note" }, h("b", {}, said || "No ticket is running."),
    v.status === "failed" && stop && stop.detail ? h("div", { style: "margin-top:6px" }, stop.detail.slice(0, 300)) : "");
}

// --- Tickets: every ticket of the Epic, in key order ---
function ticketState(v, t) {
  if (t.column === "waiting") {
    const q = v.queue.find((x) => x.key === t.key);
    if (q) return tile(QUEUE[q.state]);
  }
  if (t.column === "running" && t.step && t.step.paused) return tile(["Paused", "warn"]);
  return tile(COLUMN[t.column] || [t.column, ""]);
}

function ticketList(v) {
  const byKey = Object.fromEntries(v.tickets.map((t) => [t.key, t]));
  const closed = (key) => byKey[key] && (byKey[key].column === "merged" || byKey[key].column === "done");
  const rows = v.tickets.map((t) => {
    const open = (t.blockers || []).filter((key) => !closed(key));
    const where = t.step ? `${t.column === "stopped" ? "Stopped in " : ""}${stepName(t.step.name)} · ${since(t.step.since)}` : t.last ? lastStep(t.last) : "";
    return h("tr", { onclick: () => go(t.key) },
      h("td", { class: "t" }, h("span", { class: "key" }, t.key), t.summary || ""),
      h("td", {}, ticketState(v, t)),
      h("td", {}, t.pr ? [prLink(t.pr), " ", checksTile(t.pr)] : ""),
      h("td", { class: "opt" }, where, t.last ? h("div", { class: "muted" }, ago(t.last.time)) : ""),
      h("td", { class: "opt muted" }, open.length ? `Waits on ${open.join(", ")}` : (t.blockers || []).length ? "Met" : "None"));
  });
  return h("section", { class: "panel" },
    h("div", { class: "pbody", style: "padding-top:20px" }, v.tickets.length ? h("table", { class: "tickets" },
      h("thead", {}, h("tr", {}, h("th", {}, "Ticket"), h("th", {}, "State"), h("th", {}, "Pull request"), h("th", { class: "opt" }, "Stage or last step"), h("th", { class: "opt" }, "Dependencies"))),
      h("tbody", {}, rows)) : h("div", { class: "empty" }, "The run has not read the Epic's tickets yet."),
    h("div", { class: "fine" }, "A ticket is complete when its pull request has merged, or it was done in the tracker before this run.")));
}

// --- Ticket detail ---
function renderTicket(v) {
  const t = v.tickets.find((x) => x.key === ui.ticket);
  const main = document.getElementById("main");
  if (!t) { main.replaceChildren(h("div", { class: "panel empty" }, `${ui.ticket} is not a ticket of ${v.key}.`)); return; }
  const byKey = Object.fromEntries(v.tickets.map((x) => [x.key, x]));
  const closed = (key) => byKey[key] && (byKey[key].column === "merged" || byKey[key].column === "done");
  const blockers = (t.blockers || []).map((key) => h("div", {}, h("span", { class: closed(key) ? "" : "muted" }, `${closed(key) ? "✓" : "○"} `), key));
  const health = t.health;
  const facts = [
    ["Tracker status", t.status || "-"],
    ["Depends on", blockers.length ? blockers : "None"],
    t.pr ? ["Pull request", [prLink(t.pr), " ", checksTile(t.pr), ...t.pr.checks.map((c) => h("div", {}, h("span", { class: "muted" }, `${c.bucket} `), checkName(c)))]] : null,
    t.auto_merge ? ["Auto-merge", [tile(["Off", "warn"]), " ", t.auto_merge, h("div", { class: "muted" }, "The loop merges it itself on green.")]] : null,
    t.step ? [t.column === "stopped" ? "Stopped in" : "Stage", `${stepName(t.step.name)} · ${since(t.step.since)}${t.step.paused ? " · paused" : ""}`] : null,
    t.last ? ["Last step", `${lastStep(t.last)} · ${ago(t.last.time)}`] : null,
    t.cost ? ["API list price", h("span", { title: "What the API would bill. It is not the plan usage." }, `${money(t.cost)}, not plan usage`)] : null,
  ].filter(Boolean);
  const head = pageHead(t.summary ? `${t.key} ${t.summary}` : t.key);
  const top = h("div", { class: "detail-head" },
    t.outcome ? outcomePanel(t.outcome) : "",
    h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, ticketState(v, t), health ? tile(HEALTH[health.state], true) : ""),
    t.step ? stepper(t.step) : "",
    health && health.reason ? h("div", { class: "why", style: "margin:0" }, health.reason) : "",
    t.stuck_reason ? h("div", { class: "reason" }, t.stuck_reason) : "",
    h("dl", { class: "facts-grid" }, facts.map(([k, val]) => h("div", {}, h("dt", {}, k), h("dd", {}, val)))));
  detailPanel(main, head, top, {
    key: t.key, agents: t.agents, live: t.column === "running", events: v.events.filter((e) => e.ticket === t.key || String(e.ticket).startsWith(`${t.key}-`)),
    files: t.files, fold: Boolean(t.outcome),
  });
}

/** What happened to the ticket: the result of its latest build, the agent's reason, and each decision on its own line. */
function outcomePanel(o) {
  const [label, tone] = OUTCOME[o.result] || [o.result, ""];
  return h("div", { class: `outcome ${tone}` },
    h("div", {}, tile([label, tone], true)),
    o.reason ? h("p", {}, o.reason) : "",
    o.decisions.length ? h("ul", {}, o.decisions.map((d) => h("li", {}, d))) : "");
}

// --- Diagnostics: the whole run ---
function renderDiagnostics(v) {
  const facts = [
    ["Started", v.started ? when(v.started) : "-"],
    ["Length", v.started ? length(((v.state === "running" ? Date.now() : Date.parse(v.updated)) - Date.parse(v.started)) / 60000) : "-"],
    ["Steps", String(v.events.length)],
  ];
  const top = h("div", { class: "detail-head" },
    v.stop_reason ? h("div", { class: "reason" }, STOPPED[v.stop_reason] || `The run stopped: ${v.stop_reason}`) : "",
    h("dl", { class: "facts-grid" }, facts.map(([k, val]) => h("div", {}, h("dt", {}, k), h("dd", {}, val)))));
  detailPanel(document.getElementById("main"), pageHead("Diagnostics"), top, {
    key: v.key, agents: v.epic_agents, live: v.state === "running", events: v.events, files: v.epic_files, steps: true,
  });
}

function detailPanel(main, head, top, d) {
  const tabs = d.steps ? [["steps", `Steps · ${d.events.length}`], ["activity", `Agent activity${runs(d.agents.length)}`]]
    : [["activity", `Activity${runs(d.agents.length)}`], ["steps", `Steps · ${d.events.length}`]];
  if (d.files.length) tabs.push(["files", `Files · ${d.files.length}`]);
  if (!ui.tab || !tabs.some(([k]) => k === ui.tab)) ui.tab = tabs[0][0];
  const panel = main.querySelector(":scope > .panel.detail");
  const bar = h("div", { class: "segments" }, tabs.map(([k, label]) =>
    h("button", { class: ui.tab === k ? "on" : "", onclick: () => { ui.tab = k; ui.feed = null; render(); } }, label)));
  // The activity feed keeps its rows between polls, so an open row stays open.
  if (panel && ui.feed && ui.tab === "activity" && panel.contains(ui.feed.root) && ui.feed.key === d.key
    && (panel.children[2].tagName === "DETAILS") === Boolean(d.fold)) {
    main.firstChild.replaceWith(head);
    panel.children[0].replaceWith(top);
    panel.children[1].replaceWith(bar);
    if (ui.feed.live) pollFeed();
    return;
  }
  let body;
  if (ui.tab === "activity" && d.fold) {
    // Under an outcome the agent's raw output is folded. A redraw opens a new fold, which fires a toggle that changes nothing.
    body = h("details", { class: "output", open: ui.outputOpen === d.key,
      ontoggle: (e) => { if (e.target.open === (ui.outputOpen === d.key)) return; ui.outputOpen = e.target.open ? d.key : null; } },
      h("summary", {}, "Agent output"), activityView(d.key, d.agents, d.live));
  } else if (ui.tab === "activity") body = activityView(d.key, d.agents, d.live);
  else if (ui.tab === "steps") body = stepsView(d.events);
  else body = h("div", { class: "body files" }, d.files.map((f) => h("a", { href: fileUrl(f), target: "_blank" }, f.replace(/^runs\/[^/]+\//, ""))));
  main.replaceChildren(head, h("section", { class: "panel detail" }, top, bar, body));
}

function stepsView(events) {
  if (!events.length) return h("div", { class: "empty" }, "No steps yet.");
  return h("div", { class: "body" }, h("table", { class: "steps" }, h("tbody", {}, events.slice().reverse().map((e) =>
    h("tr", {},
      h("td", { class: "t" }, clock(e.time)),
      h("td", { class: "k" }, e.ticket),
      h("td", { class: "s" }, h("b", {}, e.step), tile([e.result, e.warning ? "warn" : RESULT[e.result] || ""])),
      h("td", { class: "d" }, e.cost !== undefined ? `${money(e.cost)} API list price · ${e.turns} turns ` : "",
        e.log ? h("a", { href: fileUrl(e.log), target: "_blank" }, "log") : "", " ", e.log ? "" : (e.detail || "").slice(0, 400)))))));
}

// --- Usage: the plan meter and this run's share against the typical one, the rest under More ---
function usageView(v) {
  const p = v.plan;
  const s = v.stats;
  const meters = WINDOWS.map(([w, label]) => {
    const r = ui.usage[w];
    if (!r) return h("div", { class: "meter" }, h("div", { class: "row1" }, h("b", {}, label), h("span", { class: "muted" }, "Unavailable")));
    const used = Math.round(r.utilization * 100);
    const tone = used >= 90 ? "bad" : used >= 70 ? "warn" : "";
    return h("div", { class: "meter" },
      h("div", { class: "row1" }, h("b", {}, label), h("span", {}, r.past ? "Unknown since reset" : `${used}% used`)),
      h("div", { class: "track" }, h("span", { class: tone, style: `width:${r.past ? 0 : Math.min(used, 100)}%` })),
      h("div", { class: "when" }, `${r.past ? "Reset" : "Resets"} ${typeof r.resets_at === "number" ? at(r.resets_at) : "at an unknown time"} · read ${ago(r.read)}`));
  });
  const figs = [];
  for (const [w, , windowName] of WINDOWS) {
    if (p.used[w] !== undefined) figs.push(h("div", {}, h("b", {}, pct(p.used[w])), `of the ${windowName} used by this run`));
    if (p.per_merged[w] !== undefined) figs.push(h("div", {}, h("b", {}, pct(p.per_merged[w])), `of the ${windowName} per merged ticket`));
    if (p.fits[w] !== undefined) figs.push(h("div", {}, h("b", {}, `About ${p.fits[w]}`), `more tickets fit in the ${windowName} at that rate`));
  }
  const delivery = [
    h("div", {}, h("b", {}, `${s.merged}`), "tickets merged in this run"),
    h("div", { title: "Of the tickets that merged in this run, the share whose first checks were green." }, h("b", {}, s.first_pass_rate === null ? "-" : `${Math.round(s.first_pass_rate * 100)}%`), "merged on the first checks"),
    h("div", {}, h("b", {}, s.median_merge_minutes === null ? "-" : length(s.median_merge_minutes)), "median from start to merge"),
    h("div", {}, h("b", {}, `${s.stuck}`), "tickets stuck"),
  ];
  ui.reportWrap = h("div", { class: "body" });
  fillReport();
  ui.forecastWrap = h("div", { class: "pbody" });
  fillForecast();
  const run = p.per_merged.five_hour;
  const share = `${run === undefined ? "This run: no share yet." : `This run: ${pct(run)} of the 5-hour window per merged ticket.`} ${p.typical === null ? "No typical share yet." : `Typical: ${pct(p.typical)}.`}`;
  return h("div", { class: "usage-grid" },
    h("section", { class: "panel", style: "grid-column:1/-1" }, h("div", { class: "phead" }, h("h2", {}, "Plan meter")), h("div", { class: "pbody" }, meters,
      h("div", { class: p.warn ? "share warn" : "share" }, share),
      h("div", { class: "fine" }, "The meter belongs to the account, so the loop and your own sessions move it together. This is the newest reading on this host."))),
    h("details", { class: "fold", style: "grid-column:1/-1", open: ui.moreOpen,
      // A redraw opens a new fold, which fires a toggle that changes nothing.
      ontoggle: (e) => { if (e.target.open === ui.moreOpen) return; ui.moreOpen = e.target.open; if (ui.moreOpen) loadForecast(true); } },
      h("summary", {}, "More"),
      h("div", { class: "usage-grid" },
        h("section", { class: "panel" }, h("div", { class: "phead" }, h("h2", {}, "This run")), h("div", { class: "pbody" },
          figs.length ? h("div", { class: "figs" }, figs) : h("div", { class: "muted" }, "No agent of this run has finished with a meter reading yet."))),
        h("section", { class: "panel" }, h("div", { class: "phead" }, h("h2", {}, "Delivered")), h("div", { class: "pbody" }, h("div", { class: "figs" }, delivery))),
        h("section", { class: "panel", style: "grid-column:1/-1" }, h("div", { class: "phead" }, h("h2", {}, "Against the run before")), ui.reportWrap),
        h("section", { class: "panel forecast", style: "grid-column:1/-1" }, h("div", { class: "phead" }, h("h2", {}, "Capacity forecast")), ui.forecastWrap))));
}

// --- Usage: the capacity forecast, read only while More is open, at most every 30 seconds ---
function loadForecast(now) {
  if (!now && ui.forecast && Date.now() - ui.forecast.at < 30000) return;
  const asked = Date.now();
  ui.forecast = { data: ui.forecast ? ui.forecast.data : undefined, at: asked };
  getJson("/api/forecast").catch(() => null).then((data) => {
    const changed = JSON.stringify(data) !== JSON.stringify(ui.forecast.data);
    ui.forecast = { data, at: asked };
    if (changed) fillForecast();
  });
}

const num = (n, digits = 1) => (typeof n === "number" ? n.toFixed(digits).replace(/\.0+$/, "") : "-");
const share = (n) => (typeof n === "number" ? `${num(n)}%` : "-");
const day = (iso) => (iso ? new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" }) : "");
const about = (n, digits = 1) => (typeof n === "number" ? `About ${num(n, digits)}` : "-");

function fillForecast() {
  const wrap = ui.forecastWrap;
  if (!wrap) return;
  const f = ui.forecast ? ui.forecast.data : undefined;
  if (f === undefined) { wrap.replaceChildren(h("div", { class: "empty" }, "Loading...")); return; }
  if (!f) { wrap.replaceChildren(h("div", { class: "empty" }, "This page has no forecast. Start it with loop watch from the repo.")); return; }
  const plan = f.plan ? f.plan.name : "the plan";
  const c = f.capacity;
  const o = f.open;
  const parts = [];
  const table = (head, rows) => h("div", { class: "scroll" }, h("table", { class: "steps cost" }, h("tbody", {},
    h("tr", { class: "sec" }, head.map((x, i) => h("td", { class: i ? "n" : "" }, x))), rows)));

  // The open work, by Epic.
  parts.push(h("h3", {}, `Open work${f.project ? ` in ${f.project}` : ""}`));
  if (f.jira && f.jira.error) parts.push(h("div", { class: "why" }, `Jira did not answer: ${f.jira.error}`));
  else if (!o || !o.epics.length) parts.push(h("div", { class: "muted" }, "Jira has no open Epic."));
  else {
    const row = (label, left, need) => h("tr", {}, h("td", {}, label), h("td", { class: "n" }, left),
      h("td", { class: "n" }, share(need.five_hour)), h("td", { class: "n" }, share(need.seven_day)));
    parts.push(table(["Epic", "Left", "5-hour", "Weekly"], [
      ...o.epics.map((x) => row([h("span", { class: "key" }, x.key), " ", x.summary], x.left === null ? "Not split yet" : `${x.left}`, x.need)),
      row(h("b", {}, "All open Epics"), h("b", {}, `${o.left}`), o.need)]));
    parts.push(h("div", { class: "fine" }, `5-hour and Weekly are the share of one ${plan} window the tickets left need. Jira read ${ago(f.jira.read)}.`));
  }

  // What the plan fits.
  parts.push(h("h3", {}, `Capacity on ${plan}`));
  if (!c) parts.push(h("div", { class: "muted" }, `No run on ${plan} has merged a ticket under a meter reading yet.`));
  else {
    const fits = (x) => [
      h("div", {}, h("b", {}, about(x.five_hour)), "tickets per 5-hour window"),
      h("div", {}, h("b", {}, about(x.week, 0)), "tickets per week"),
      h("div", {}, h("b", {}, num(x.weeks, 2)), "weeks for the open work"),
    ];
    parts.push(h("div", { class: "figs" }, fits(c)));
    for (const b of c.bigger) {
      parts.push(h("div", { class: "fine" }, `${b.name}, $${b.price_more} a month more: ${about(b.five_hour)} tickets per 5-hour window, ${about(b.week, 0).toLowerCase()} per week, ${num(b.weeks, 2)} weeks for the open work.`));
    }
    parts.push(h("div", { class: "fine" }, `From ${plural(c.tickets, "merged ticket", "merged tickets")} in ${plural(c.runs, "run", "runs")} on ${plan}. A bigger plan is scaled by Anthropic's stated multiple.`));
  }

  // Each plan's runs, side by side.
  if (f.periods.length) {
    parts.push(h("h3", {}, "Plans compared"));
    const cols = f.periods;
    const row = (label, get) => h("tr", {}, h("td", {}, label), ...cols.map((p) => h("td", { class: "n" }, get(p))));
    parts.push(table(["", ...cols.map((p) => p.name)], [
      row("Runs", (p) => `${p.runs}, ${day(p.from)} to ${day(p.to)}`),
      row("Tickets merged", (p) => `${p.merged}`),
      row("Merged on the first checks", (p) => (p.first_pass_rate === null ? "-" : `${Math.round(p.first_pass_rate * 100)}%`)),
      row("Fix attempts after red checks per merged ticket", (p) => num(p.fixes_per_merged, 2)),
      row("Tickets stuck", (p) => `${p.stuck}`),
      row("Median time to merge, less waits", (p) => (p.median_minutes === null ? "-" : length(p.median_minutes))),
      row("Usage limits hit, and hours a run waited", (p) => `${p.waits}${p.waits ? `, ${num(p.waited_hours)} h` : ""}`)]));
    parts.push(h("div", { class: "fine" }, "A fix attempt after red checks is a round of the agent's work that follows a red wait. A run that may straddle a plan change counts as Unclear. Tickets differ in size, so a change between plans is not caused by the plan alone."));
  }
  parts.push(h("div", { class: "fine" }, `The meter is the account's, so your own sessions during a run count toward it. A ticket is left when Jira has it open, not in ${f.landed_status}, and no run on this host merged it. Prices are the subscription's, not the API list price.`));
  wrap.replaceChildren(...parts);
}

// The comparison reads every run on the host, so a poll asks for it at most every 10 seconds.
function loadReport() {
  const key = `${ui.project}/${ui.epic}`;
  if (ui.report && ui.report.key === key && Date.now() - ui.report.at < 10000) return;
  const asked = Date.now();
  const before = ui.report && ui.report.key === key ? ui.report.data : undefined;
  ui.report = { key, data: before, at: asked };
  getJson(api(`/api/report/${ui.epic}`)).catch(() => null).then((data) => {
    if (!ui.report || ui.report.key !== key) return;
    const changed = JSON.stringify(data) !== JSON.stringify(ui.report.data);
    ui.report = { key, data, at: asked };
    if (changed) fillReport();
  });
}

function fillReport() {
  const wrap = ui.reportWrap;
  if (!wrap) return;
  const data = ui.report && ui.report.key === `${ui.project}/${ui.epic}` ? ui.report.data : undefined;
  if (data === undefined) wrap.replaceChildren(h("div", { class: "empty" }, "Loading..."));
  else wrap.replaceChildren(data ? costTable(data) : h("div", { class: "empty" }, "No run of this Epic has a cost yet."));
}

function figure(kind, n) {
  if (n === null || n === undefined) return "-";
  if (kind === "money") return money(n);
  if (kind === "minutes") return `${Math.round(n)} min`;
  if (kind === "percent") return pct(n);
  if (kind === "tokens") return n.toLocaleString();
  return String(n);
}

function costTable(report) {
  const before = report.previous ? `${report.previous.epic} ${(report.previous.started || "").slice(0, 10)}` : "No earlier run";
  const rows = [];
  let section = "";
  for (const row of report.rows) {
    if (row.section !== section) {
      section = row.section;
      const top = rows.length === 0;
      rows.push(h("tr", { class: "sec" }, h("td", {}, section), h("td", { class: "n" }, top ? before : ""),
        h("td", { class: "n" }, top ? "This run" : ""), h("td", { class: "n" }, top ? "Change" : "")));
    }
    const change = typeof row.change === "number" ? `${row.change > 0 ? "+" : ""}${row.change}%` : row.change || "";
    const tone = (row.kind === "money" || row.kind === "percent") && typeof row.change === "number" && row.change !== 0 ? (row.change < 0 ? "down" : "up") : "";
    const n = row.kind === "text" ? "n txt" : "n";
    rows.push(h("tr", {}, h("td", {}, row.label), h("td", { class: n }, figure(row.kind, row.previous)),
      h("td", { class: n }, figure(row.kind, row.current)), h("td", { class: `n ${tone}` }, change)));
  }
  return h("table", { class: "steps cost" }, h("tbody", {}, rows));
}

// --- Agent activity: one line per tool call, read from the log as it grows ---
function activityView(key, agents, live) {
  if (!agents.length) return h("div", { class: "empty" }, "No agent run yet.");
  if (!ui.agent || !agents.some((a) => a.number === ui.agent)) ui.agent = agents[agents.length - 1].number;
  const root = h("div", { class: "feed" });
  const follow = h("input", { type: "checkbox", checked: ui.follow, onchange: (e) => { ui.follow = e.target.checked; } });
  const wrap = h("div", { class: "body" },
    h("div", { class: "runs" },
      agents.map((a) => h("button", { class: a.number === ui.agent ? "on" : "", onclick: () => { ui.agent = a.number; ui.feed = null; render(); } }, `Run ${a.number}`)),
      h("label", {}, follow, "Follow")),
    root);
  ui.feed = { key, wrap, root, agent: ui.agent, offset: 0, rows: {}, live: live && ui.agent === agents[agents.length - 1].number, busy: false };
  pollFeed();
  return wrap;
}

async function pollFeed() {
  const feed = ui.feed;
  if (!feed || feed.busy) return;
  feed.busy = true;
  try {
    for (;;) {
      const data = await getJson(api(`/api/agent/${ui.epic}/${feed.key}/${feed.agent}?offset=${feed.offset}`));
      if (feed !== ui.feed) return;
      const root = feed.root;
      const atEnd = feed.offset === 0 || root.scrollHeight - root.scrollTop - root.clientHeight < 40;
      for (const item of data.items) addItem(feed, item);
      feed.offset = data.offset;
      if (data.items.length && ui.follow && atEnd) root.scrollTop = root.scrollHeight;
      if (data.offset >= data.size) break;
    }
  } catch { /* The next poll tries again. */ } finally { feed.busy = false; }
}

function addItem(feed, item) {
  const sub = item.parent ? " sub" : "";
  if (item.kind === "output") {
    const target = feed.rows[item.id];
    if (!target) return;
    target.mark.className = `mark ${item.error ? "bad" : "ok"}`;
    target.mark.textContent = item.denied ? "⛔" : item.error ? "✗" : "✓";
    if (item.denied) target.row.classList.add("denied");
    if (item.text) target.detail.append(`\n\n── result ──\n${item.text}`);
    return;
  }
  let row = null;
  if (item.kind === "init") row = h("div", { class: "divider" }, `Session started${item.model ? ` · ${item.model}` : ""}`);
  else if (item.kind === "result") row = h("div", { class: "divider" }, `Turn ended${item.error ? " with an error" : ""} · ${money(item.total_cost_usd)} API list price · ${item.num_turns ?? "?"} turns · ${Math.round((item.duration_ms || 0) / 60000)} min`);
  else if (item.kind === "text") row = h("div", { class: `item${sub}` }, h("div", { class: "text", onclick: (e) => e.currentTarget.classList.toggle("open") }, item.text));
  else if (item.kind === "status") {
    row = h("div", { class: `verdict ${item.status}` }, h("b", {}, item.status === "done" ? "Done. " : "Blocked. "), item.text,
      item.decisions?.length ? h("ul", {}, item.decisions.map((d) => h("li", {}, d))) : "");
  } else if (item.kind === "tool") {
    const mark = h("span", { class: "mark wait" }, "…");
    const detail = h("pre", { class: "detail", hidden: true }, item.detail || item.summary);
    const line = h("div", { class: "tool", onclick: () => { detail.hidden = !detail.hidden; } },
      h("span", { class: "name" }, item.tool), h("span", { class: "what", title: item.summary }, item.summary), mark);
    row = h("div", { class: `item${sub}` }, line, detail);
    feed.rows[item.id] = { row, mark, detail };
  }
  if (row) feed.root.append(row);
}

route();
setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
// A tab that comes back to the front catches up at once.
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
