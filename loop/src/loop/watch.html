<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
<style>
/* The look follows the Pitchridge design system (its ADR 0045): a warm off-white ground, fine type, and much
   space. Light only. Tokens are named by role. One accent, here the neutral one, marks the active tab, links,
   focus rings, and selection. The category colors fill only a small status tile, never a button or a link. */
:root {
  color-scheme: light;
  --ground: #f6f5f2;
  --stage: #ecebe7;
  --surface: #ffffff;
  --fill: #edece8;
  --text: #1b1b19;
  --text-muted: #6b6a65;
  --line: #e2e1dc;
  --line-strong: #8a8984;
  --danger: #c42b1c;
  --run: #2856c8; --run-soft: #e7eefc;
  --warn: #9a5800; --warn-soft: #fbefdb;
  --bad: #b8203f; --bad-soft: #fbe4e9;
  --confirm: #14632f; --confirm-soft: #e6f4ea;
  --accent-text: #1b1b19;
  --accent-focus: #1b1b19;
  --accent-soft: #f0f0ed;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-sm: 10px; --radius-md: 14px; --radius-full: 999px;
  --shadow-md: 0 2px 6px rgba(27, 27, 25, 0.06), 0 8px 24px rgba(27, 27, 25, 0.1);
  --column: 1120px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--text); font: 400 14px/20px var(--sans); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent-focus); outline-offset: 2px; }
::selection { background: var(--accent-soft); color: var(--text); }
a { color: var(--accent-text); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--text); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
code { font-family: var(--code); font-size: 12.5px; background: var(--fill); padding: 1px 6px; border-radius: 6px; color: var(--text); }
.muted { color: var(--text-muted); }
.wrap { max-width: var(--column); margin: 0 auto; padding-left: 24px; padding-right: 24px; }
@media (max-width: 1023px) { .wrap { padding-left: 16px; padding-right: 16px; } }
@media (prefers-reduced-motion: reduce) { *, ::before, ::after { transition: none !important; animation: none !important; } }

/* --- Top bar: the project, the Epic, the views, and the run --- */
header { position: sticky; top: 0; z-index: 5; background: var(--ground); border-bottom: 1px solid transparent; transition: border-color 160ms; }
header.scrolled { border-bottom-color: var(--line); }
.bar { display: flex; align-items: center; gap: 16px; height: 56px; }
.ctx { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 0 1 auto; }
.ctx .slash { color: var(--line-strong); }
.picker { position: relative; display: inline-flex; min-width: 0; border-radius: var(--radius-sm); }
.picker:hover { background: var(--fill); }
.picker select { field-sizing: content; appearance: none; -webkit-appearance: none; background: transparent; border: 0; border-radius: var(--radius-sm); padding: 6px 26px 6px 10px; font-weight: 550; min-width: 0; max-width: 100%; text-overflow: ellipsis; cursor: pointer; }
.picker select:disabled { cursor: default; opacity: 1; }
.picker::after { content: ""; position: absolute; right: 11px; top: 50%; width: 5px; height: 5px; border-right: 1.5px solid var(--text-muted); border-bottom: 1.5px solid var(--text-muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.picker.project { flex: none; }
.picker.single:hover { background: none; }
.picker.single::after { display: none; }
.picker.single select { padding-right: 10px; }
.compact-title { display: none; }
nav.tabs { display: flex; gap: 4px; flex: 1; }
nav.tabs a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-full); color: var(--text-muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
nav.tabs a:hover { color: var(--text); background: var(--fill); }
nav.tabs a.on { color: var(--accent-text); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--line); }
nav.tabs svg { width: 18px; height: 18px; }
.run { display: flex; align-items: center; gap: 12px; margin-left: auto; color: var(--text-muted); font-size: 13px; white-space: nowrap; }
@media (max-width: 1023px) {
  .bar { height: 52px; gap: 8px; }
  .run .last, .run .pr { display: none; }
  /* The large title has scrolled away, so the bar names the page. */
  header.scrolled .ctx { display: none; }
  header.scrolled .compact-title { display: block; flex: 1; min-width: 0; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A floating, opaque pill with a static shadow, and no backdrop-filter. */
  nav.tabs { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); flex: none; gap: 2px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-full); box-shadow: var(--shadow-md); }
  nav.tabs a { flex-direction: column; gap: 2px; min-width: 72px; padding: 6px 10px; font-size: 11px; line-height: 14px; letter-spacing: .01em; }
  nav.tabs a.on { box-shadow: none; }
  nav.tabs svg { width: 22px; height: 22px; }
}

/* --- Page --- */
main.wrap { padding-top: 8px; padding-bottom: 48px; display: grid; gap: 24px; }
@media (max-width: 1023px) { main.wrap { padding-bottom: 112px; gap: 16px; } }
.pagehead { padding: 16px 0 4px; }
.pagehead .over { color: var(--text-muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pagehead h1 { margin: 4px 0 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
@media (max-width: 1023px) { .pagehead h1 { font-size: 34px; line-height: 40px; font-weight: 650; letter-spacing: -0.02em; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); min-width: 0; }
.phead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 20px 24px 0; }
.phead h2 { margin: 0; font-size: 17px; line-height: 22px; font-weight: 600; }
.phead .aside { color: var(--text-muted); }
.pbody { padding: 16px 24px 24px; }
@media (max-width: 1023px) { .phead { padding: 16px 16px 0; } .pbody { padding: 12px 16px 16px; } }
.empty { padding: 32px 16px; text-align: center; color: var(--text-muted); }

/* A status tile: the only place a category color shows. */
.tile { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: var(--radius-full); font-size: 12px; line-height: 18px; font-weight: 500; white-space: nowrap; background: var(--fill); color: var(--text-muted); }
.tile.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tile.run { background: var(--run-soft); color: var(--run); }
.tile.ok { background: var(--confirm-soft); color: var(--confirm); }
.tile.warn { background: var(--warn-soft); color: var(--warn); }
.tile.bad { background: var(--bad-soft); color: var(--bad); }
.tile.plain { background: var(--fill); color: var(--text); }

/* --- Overview: the figures --- */
.metrics { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 759px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .metrics > :first-child { grid-column: 1 / -1; } }
.metric { padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 759px) { .metric { padding: 16px; } }
.metric h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-muted); }
.figure { font-variant-numeric: tabular-nums; color: var(--text-muted); }
.figure b { font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); margin-right: 6px; }
.figure.na b { font-size: 17px; line-height: 32px; color: var(--text-muted); }
.track { height: 4px; border-radius: var(--radius-full); background: var(--fill); overflow: hidden; }
.track > span { display: block; height: 100%; border-radius: var(--radius-full); background: var(--text); }
.track > span.warn { background: var(--warn); } .track > span.bad { background: var(--danger); }
.metric .sub { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* --- Overview: the work queue and the screenshots --- */
.work { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1024px) { .work { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
@media (max-width: 1023px) { .work { gap: 16px; } }
.group + .group { margin-top: 24px; }
.group > h3 { margin: 0 0 8px; font-size: 14px; font-weight: 500; color: var(--text-muted); }
.current { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 16px; transition: border-color 160ms; }
.current + .current { margin-top: 12px; }
.current:hover { border-color: var(--line-strong); }
.current .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.key { color: var(--text-muted); font-variant-numeric: tabular-nums; font-weight: 500; }
.current .title { font-size: 16px; line-height: 22px; font-weight: 550; margin: 4px 0 14px; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 14px 0 0; }
.facts dt { color: var(--text-muted); }
.facts dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.facts .toolname { color: var(--text-muted); font-weight: 500; margin-right: 6px; }
.why { margin-top: 12px; color: var(--warn); }
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.stepper .st { font-size: 12px; line-height: 16px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper .st::before { content: ""; display: block; height: 3px; border-radius: var(--radius-full); background: var(--fill); margin-bottom: 6px; }
.stepper .st.past::before { background: var(--line-strong); }
.stepper .st.now { color: var(--text); font-weight: 500; }
.stepper .st.now::before { background: var(--text); }
.stepper .st.now.paused { color: var(--warn); }
.stepper .st.now.paused::before { background: var(--warn); }
@media (max-width: 520px) { .stepper .st { font-size: 11px; } }
.note { padding: 16px; border-radius: var(--radius-sm); background: var(--ground); color: var(--text-muted); }
.note b { color: var(--text); font-weight: 550; }
.list { list-style: none; margin: 0; padding: 0; }
.list button { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 4px; min-height: 44px; }
.list li:first-child button { border-top: 0; }
.list button:hover .what > div:first-child { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.list .n { color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: right; }
.list .what { min-width: 0; }
.list .what > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .rowreason { margin-top: 2px; color: var(--text-muted); white-space: normal !important; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.more { margin-top: 8px; color: var(--text-muted); }

/* Screenshots */
.proof-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.proof-head .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
.thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
.thumbs.wide { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.thumb { display: block; padding: 0; border: 0; background: none; text-align: left; min-width: 0; }
.thumb img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: top; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--stage); transition: border-color 160ms; }
.thumb:hover img { border-color: var(--line-strong); }
.thumb span { display: block; margin-top: 6px; font-size: 12px; line-height: 16px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- Tickets --- */
table.tickets { width: 100%; border-collapse: collapse; }
table.tickets th { text-align: left; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-muted); padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
table.tickets td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.tickets tr:last-child td { border-bottom: 0; }
table.tickets tbody tr { cursor: pointer; }
table.tickets tbody tr:hover td { background: var(--ground); }
table.tickets td.t { overflow-wrap: anywhere; font-weight: 500; }
table.tickets td.t .key { display: block; }
@media (max-width: 760px) { table.tickets .opt { display: none; } }

/* --- Ticket and run detail --- */
.detail-head { padding: 20px 24px; display: grid; gap: 16px; }
@media (max-width: 1023px) { .detail-head { padding: 16px; } }
.facts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px 24px; margin: 0; }
.facts-grid div { min-width: 0; }
.facts-grid dt { color: var(--text-muted); }
.facts-grid dd { margin: 2px 0 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.reason { padding: 12px 16px; border-radius: var(--radius-sm); background: var(--bad-soft); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.segments { display: flex; gap: 4px; padding: 0 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow-x: auto; }
.segments button { background: none; border: 0; padding: 12px 8px; color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.segments button:hover { color: var(--text); }
.segments button.on { color: var(--accent-text); border-bottom-color: var(--accent-text); }
.body { padding: 16px 24px 24px; }
@media (max-width: 1023px) { .body { padding: 12px 16px 16px; } }
.runs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.runs button { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-full); padding: 4px 12px; font-size: 13px; }
.runs button.on { background: var(--accent-soft); border-color: var(--accent-text); }
.runs label { margin-left: auto; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
.runs input { accent-color: var(--text); }
.feed { max-height: calc(100vh - 300px); min-height: 200px; overflow-y: auto; border-top: 1px solid var(--line); }
@media (max-width: 1023px) { .feed { max-height: 70vh; } }
.item { border-bottom: 1px solid var(--line); padding: 7px 2px; }
.item.sub { margin-left: 18px; padding-left: 10px; border-left: 2px solid var(--line); }
.tool { display: flex; gap: 10px; align-items: baseline; cursor: pointer; min-width: 0; }
.tool .name { color: var(--text-muted); font-weight: 500; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .mark { flex: none; width: 16px; text-align: center; }
.mark.ok { color: var(--confirm); } .mark.bad { color: var(--danger); } .mark.wait { color: var(--line-strong); }
.item.denied { background: var(--bad-soft); }
.item.denied .what::before { content: "Denied by auto mode: "; color: var(--bad); font-weight: 550; }
pre.detail { margin: 8px 0 2px; padding: 10px 12px; background: var(--ground); border: 1px solid var(--line); border-radius: var(--radius-sm); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/18px var(--code); max-height: 360px; overflow: auto; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.text.open { display: block; }
.divider { font-size: 12px; color: var(--text-muted); padding: 8px 2px; border-bottom: 1px solid var(--line); }
.verdict { margin: 8px 0; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--confirm-soft); }
.verdict.blocked { background: var(--bad-soft); }
.verdict ul { margin: 6px 0 0; padding-left: 18px; }
.steps { width: 100%; border-collapse: collapse; }
.steps td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.steps tr:last-child td { border-bottom: 0; }
.steps td.t { white-space: nowrap; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.steps td.k { white-space: nowrap; color: var(--text-muted); }
.steps td.s { white-space: nowrap; }
.steps td.s b { font-weight: 550; margin-right: 6px; }
.steps td.d { color: var(--text-muted); overflow-wrap: anywhere; }
@media (max-width: 820px) { .steps td.k { display: none; } .steps td.s { white-space: normal; } }
.cost td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cost td.n.txt { white-space: normal; overflow-wrap: anywhere; }
.cost tr.sec td { padding-top: 20px; font-size: 12px; font-weight: 500; color: var(--text-muted); }
.cost td.up { color: var(--danger); } .cost td.down { color: var(--confirm); }
@media (max-width: 520px) { .cost td { padding: 8px 4px; font-size: 13px; } }
.files a { display: block; padding: 4px 0; overflow-wrap: anywhere; }

/* --- Usage --- */
.usage-grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .usage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1023px) { .usage-grid { gap: 16px; } }
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; }
.figs div { color: var(--text-muted); }
.figs b { display: block; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.figs + .figs { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
.meter + .meter { margin-top: 20px; }
.meter .row1 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.meter .row1 b { font-weight: 550; }
.meter .when { margin-top: 6px; color: var(--text-muted); font-size: 13px; }
.fine { margin-top: 16px; color: var(--text-muted); font-size: 13px; }

/* --- Screenshot viewer --- */
.viewer { position: fixed; inset: 0; z-index: 20; background: var(--ground); display: flex; flex-direction: column; }
.viewer[hidden] { display: none; }
.vbar { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
.vbar .name { min-width: 0; flex: 1 1 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vbar .name b { font-weight: 550; }
.vbar .name span { color: var(--text-muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 14px; background: var(--fill); border: 0; border-radius: var(--radius-full); color: var(--text); font-weight: 500; text-decoration: none; }
.btn:hover { background: var(--stage); }
.btn.primary { background: var(--text); color: var(--surface); }
.btn.primary:hover { background: #33332f; }
.vbar select { min-height: 36px; background: var(--fill); border: 0; border-radius: var(--radius-full); padding: 0 12px; font-weight: 500; }
.vstage { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 24px; background: var(--stage); }
.vstage img { max-width: min(100%, 1400px); height: auto; border-radius: var(--radius-sm); background: var(--surface); box-shadow: var(--shadow-md); }
.vstrip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 24px; background: var(--surface); border-top: 1px solid var(--line); }
.vstrip button { flex: none; width: 84px; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: var(--stage); }
.vstrip button.on { border-color: var(--accent-text); }
.vstrip img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: top; }
</style>
</head>
<body>
<header id="top">
  <div class="wrap bar">
    <div class="ctx">
      <label class="picker project"><select id="project" aria-label="Project"></select></label>
      <span class="slash">/</span>
      <label class="picker epic"><select id="epic" aria-label="Epic"></select></label>
    </div>
    <div class="compact-title" id="compact"></div>
    <nav class="tabs" id="views" aria-label="Views"></nav>
    <div class="run" id="run"></div>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="viewer" id="viewer" hidden></div>
<script>
"use strict";
const POLL_MS = 3000;
// A poll redraws the page when its data changes, and at least this often, so each age stays current.
const AGE_MS = 15000;
const KEY = /^[A-Z][A-Z0-9]*-\d+$/;
// Phosphor icons (MIT), Regular and Fill: the Fill weight marks the active tab.
const ICONS = {

// --- Routing: #/<project>/<Epic>/<view or ticket> ---
function readHash() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  // An address from before projects names the Epic first.
  if (parts[0] && KEY.test(parts[0])) parts.unshift("");
  const [project, epic, page] = parts;
  ui.project = project || null;
  ui.epic = epic || null;
  ui.ticket = page && KEY.test(page) ? page : null;

async function route() {
  const before = `${ui.project}/${ui.epic}/${ui.page}/${ui.ticket}`;
  readHash();
  if (`${ui.project}/${ui.epic}/${ui.page}/${ui.ticket}` !== before) { ui.agent = null; ui.feed = null; ui.tab = null; window.scrollTo(0, 0); }
  ui.drawn = null;
  await refresh();
}

// --- Data: every figure comes from one poll, and a poll redraws only when something changed ---
async function refresh() {
  let projects;
  try { [projects, ui.usage] = await Promise.all([getJson("/api/projects"), getJson("/api/usage")]); } catch { return; }
  ui.projects = projects;
  if (!ui.project || !projects.some((p) => p.name === ui.project)) { go("", projects[0].name, ui.epic); return; }
  try { ui.epics = await getJson(api("/api/epics")); } catch { return; }
  renderContext();
  if (!ui.epics.length) {
    ui.view = null;
    document.getElementById("run").replaceChildren();
    document.getElementById("views").replaceChildren();
    document.getElementById("main").replaceChildren(h("div", { class: "panel empty" }, "No runs of this project on this host yet. ", h("code", {}, "loop start <Epic key>"), " starts one."));
    return;
  }
  if (!ui.epic || !ui.epics.some((e) => e.key === ui.epic)) {
    const running = ui.epics.find((e) => e.running);
    go("", ui.project, (running || ui.epics[0]).key);
    return;
  }
  try { ui.view = await getJson(api(`/api/epic/${ui.epic}`)); } catch { return; }
  if (ui.page === "usage") loadReport();
  const drawn = JSON.stringify([ui.view, ui.usage, ui.page, ui.ticket, Math.floor(Date.now() / AGE_MS)]);
  if (drawn !== ui.drawn) { ui.drawn = drawn; render(); }

}

  epic.replaceChildren(...ui.epics.map((e) => h("option", { value: e.key, selected: e.key === ui.epic },
    `${e.key}${e.summary ? ` · ${e.summary}` : ""}${e.running ? " (running)" : ""}`)));

    if (!ui.report || ui.report.key !== key) return;

  const feed = ui.feed;
  if (!feed || feed.busy) return;
  feed.busy = true;
  try {
    for (;;) {
      const data = await getJson(api(`/api/agent/${ui.epic}/${feed.key}/${feed.agent}?offset=${feed.offset}`));
      if (feed !== ui.feed) return;
      const root = feed.root;
      const atEnd = feed.offset === 0 || root.scrollHeight - root.scrollTop - root.clientHeight < 40;
      for (const item of data.items) addItem(feed, item);
      feed.offset = data.offset;
      if (data.items.length && ui.follow && atEnd) root.scrollTop = root.scrollHeight;
      if (data.offset >= data.size) break;

    target.mark.textContent = item.denied ? "⛔" : item.error ? "✗" : "✓";
    if (item.denied) target.row.classList.add("denied");
    if (item.text) target.detail.append(`\n\n── result ──\n${item.text}`);
    return;
  }
  let row = null;
  if (item.kind === "init") row = h("div", { class: "divider" }, `Session started${item.model ? ` · ${item.model}` : ""}`);
  else if (item.kind === "result") row = h("div", { class: "divider" }, `Turn ended${item.error ? " with an error" : ""} · ${money(item.total_cost_usd)} API list price · ${item.num_turns ?? "?"} turns · ${Math.round((item.duration_ms || 0) / 60000)} min`);
  else if (item.kind === "text") row = h("div", { class: `item${sub}` }, h("div", { class: "text", onclick: (e) => e.currentTarget.classList.toggle("open") }, item.text));
  else if (item.kind === "status") {
    row = h("div", { class: `verdict ${item.status}` }, h("b", {}, item.status === "done" ? "Done. " : "Blocked. "), item.text,
      item.decisions?.length ? h("ul", {}, item.decisions.map((d) => h("li", {}, d))) : "");
  } else if (item.kind === "tool") {
    const mark = h("span", { class: "mark wait" }, "…");
    const detail = h("pre", { class: "detail", hidden: true }, item.detail || item.summary);
    const line = h("div", { class: "tool", onclick: () => { detail.hidden = !detail.hidden; } },
      h("span", { class: "name" }, item.tool), h("span", { class: "what", title: item.summary }, item.summary), mark);
    row = h("div", { class: `item${sub}` }, line, detail);
    feed.rows[item.id] = { row, mark, detail };
  }
  if (row) feed.root.append(row);
}

route();
setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
// A tab that comes back to the front catches up at once.
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
