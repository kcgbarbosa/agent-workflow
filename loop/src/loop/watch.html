<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Watch</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #1b1f24; --muted: #5d6673; --faint: #8a93a0;
  --accent: #2f6fde; --ok: #1f8a4c; --ok-bg: #e5f5ec; --bad: #c8322b; --bad-bg: #fde9e7;
  --warn: #9a6400; --warn-bg: #fdf3dc; --run: #2f6fde; --run-bg: #e6eefc; --code-bg: #f1f3f6;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #181c21; --line: #2a3038; --text: #e6e9ed; --muted: #a0a8b3; --faint: #6e7782;
    --accent: #6ea0ff; --ok: #4cc283; --ok-bg: #16301f; --bad: #ff7b72; --bad-bg: #3a1d1b;
    --warn: #e3b341; --warn-bg: #352a12; --run: #6ea0ff; --run-bg: #1a2a45; --code-bg: #0d1014;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* --- Header --- */
header {
  position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
header select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font-family: var(--mono); font-size: 12.5px; }
header .title { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 220px; }
header .title b { font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#state { display: inline-flex; align-items: center; gap: 6px; flex: none; }
header .meta { display: flex; gap: 4px 14px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; flex-basis: 100%; }
@media (min-width: 1024px) { header .meta { flex-basis: auto; } }

.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.running, .pill.run { background: var(--run-bg); color: var(--run); }
.pill.landed, .pill.pass, .pill.ok, .pill.done, .pill.pr-open, .pill.new { background: var(--ok-bg); color: var(--ok); }
.pill.stuck, .pill.fail, .pill.stopped, .pill.error, .pill.conflict, .pill.blocked, .pill.timeout, .pill.loop-error { background: var(--bad-bg); color: var(--bad); }
.pill.waiting, .pill.idle, .pill.restart, .pill.pr-draft, .pill.usage-limit, .pill.usage-pause, .pill.paused, .pill.findings { background: var(--warn-bg); color: var(--warn); }
.pill.neutral { background: var(--code-bg); color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--run); flex: none; }
.dot.live { animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

#alerts { padding: 0 16px; }
.alert { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--bad-bg); color: var(--text); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); overflow-wrap: anywhere; }
.alert b { color: var(--bad); }

/* --- Layout: one column on a phone, in reading order; from 1024 px a main column and a side column --- */
main { display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 24px; }
.col { display: contents; }
#plan { order: 1; } #stats { order: 2; } #running { order: 3; } #boardwrap { order: 4; } #recent { order: 5; }
#progress { display: none; }
@media (min-width: 1024px) {
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; gap: 16px; padding: 16px; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  #progress { display: block; }
}
@media (min-width: 1400px) { main { grid-template-columns: minmax(0, 1fr) 360px; } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 14px 0; }
.card-head h2 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.card-body { padding: 10px 14px 14px; }
.note { font-size: 12px; color: var(--faint); margin-top: 10px; }

/* Stat cards: 2 by 2 on a phone, one row from 1024 px */
#stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 1024px) { #stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; } }
.stat { padding: 12px 14px; }
.stat .label { font-size: 12px; color: var(--muted); }
.stat .value { font-size: 26px; font-weight: 650; line-height: 1.2; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat .value small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.stat .sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
.segbar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--code-bg); margin-top: 8px; }
.segbar span { display: block; height: 100%; }
.seg-landed { background: var(--ok); } .seg-running { background: var(--run); } .seg-stuck { background: var(--bad); } .seg-waiting { background: color-mix(in srgb, var(--warn) 55%, var(--line)); }

/* Plan meter */
.meter + .meter { margin-top: 12px; }
.meter .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.meter .name { font-weight: 600; }
.meter .pct { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.meter .track { height: 8px; border-radius: 999px; background: var(--code-bg); overflow: hidden; margin: 4px 0 3px; }
.meter .fill { height: 100%; border-radius: 999px; background: var(--accent); }
.meter .fill.warn { background: var(--warn); } .meter .fill.bad { background: var(--bad); }
.meter .when { font-size: 12px; color: var(--muted); }
.figures { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.figures div { font-size: 12px; color: var(--muted); }
.figures b { display: block; font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }

/* Running now */
.runcards { display: grid; gap: 10px; }
@media (min-width: 1024px) { .runcards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
.runcard { display: block; width: 100%; text-align: left; cursor: pointer; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.runcard:hover { border-color: var(--faint); }
.runcard .top { display: flex; align-items: center; gap: 8px; }
.runcard .key { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.runcard .sum { margin: 2px 0 10px; font-weight: 550; overflow-wrap: anywhere; }
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.stepper .st { font-size: 11px; color: var(--faint); text-align: center; }
.stepper .st::before { content: ""; display: block; height: 4px; border-radius: 999px; background: var(--line); margin-bottom: 4px; }
.stepper .st.past::before { background: var(--ok); }
.stepper .st.now { color: var(--run); font-weight: 600; }
.stepper .st.now::before { background: var(--run); }
.stepper .st.now.paused { color: var(--warn); }
.stepper .st.now.paused::before { background: var(--warn); }
.runcard .elapsed { font-size: 12px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
.runcard .lines { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; display: grid; gap: 3px; }
.runcard .line { display: flex; gap: 6px; font-size: 12.5px; min-width: 0; }
.runcard .line .name { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--code-bg); border-radius: 4px; padding: 0 5px; flex: none; }
.runcard .line .what { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idle-note { padding: 14px; color: var(--faint); font-size: 13px; }

/* Progress ring */
.ring { --size: 120px; width: var(--size); height: var(--size); border-radius: 50%; display: grid; place-items: center; flex: none; }
.ring .hole { width: calc(var(--size) - 26px); height: calc(var(--size) - 26px); border-radius: 50%; background: var(--panel); display: grid; place-items: center; text-align: center; }
.ring .hole b { font-size: 22px; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.ring .hole span { font-size: 11px; color: var(--faint); }
.progress { display: flex; align-items: center; gap: 16px; }
.legend { display: grid; gap: 4px; font-size: 13px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend b { margin-left: auto; font-variant-numeric: tabular-nums; padding-left: 12px; }

/* Recent activity */
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.events li:last-child { border-bottom: 0; }
.events .t { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.events .w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.events .k { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 6px; }

/* Board and detail */
#boardwrap { display: grid; gap: 14px; }
@media (min-width: 1024px) { #boardwrap { grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); align-items: start; gap: 16px; } }
.board { display: flex; flex-direction: column; gap: 14px; }
.group h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.card {
  display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
}
.card:hover { border-color: var(--faint); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card .row { display: flex; align-items: center; gap: 8px; }
.card .key { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.card .sum { margin: 2px 0; }
.card .sub { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.card.epic { background: transparent; border-style: dashed; }

#detail > .head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
#detail > .head h2 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.reason { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--bad-bg); white-space: pre-wrap; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 9px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.body { padding: 10px 14px 14px; }

.runs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.runs button { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
.runs button.on { border-color: var(--accent); color: var(--accent); }
.runs label { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }

.feed { max-height: calc(100vh - 220px); overflow-y: auto; border-top: 1px solid var(--line); }
@media (max-width: 1023px) { .feed { max-height: 70vh; } }
.item { border-bottom: 1px solid var(--line); padding: 5px 2px; }
.item.sub { margin-left: 18px; padding-left: 8px; border-left: 2px solid var(--line); }
.tool { display: flex; gap: 8px; align-items: baseline; cursor: pointer; min-width: 0; }
.tool .name { font-family: var(--mono); font-size: 11.5px; color: var(--muted); background: var(--code-bg); border-radius: 4px; padding: 0 5px; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .mark { flex: none; font-size: 12px; width: 16px; text-align: center; }
.mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); } .mark.wait { color: var(--faint); }
.item.denied { background: var(--bad-bg); }
.item.denied .what::before { content: "Denied by auto mode: "; color: var(--bad); font-weight: 600; }
pre.detail { margin: 6px 0 2px; padding: 8px; background: var(--code-bg); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 var(--mono); max-height: 360px; overflow: auto; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.text.open { display: block; }
.divider { font-size: 12px; color: var(--faint); padding: 6px 2px; border-bottom: 1px solid var(--line); }
.status { margin: 6px 0; padding: 8px 10px; border-radius: 6px; background: var(--ok-bg); }
.status.blocked { background: var(--bad-bg); }
.status ul { margin: 6px 0 0; padding-left: 18px; }

.steps { width: 100%; border-collapse: collapse; }
.steps td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.steps td.t { white-space: nowrap; color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
.steps td.k { white-space: nowrap; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.steps td.d { color: var(--muted); overflow-wrap: anywhere; font-size: 12.5px; }
@media (max-width: 820px) { .steps td.k { display: none; } }
.cost td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cost td.n.text { white-space: normal; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; }
.cost tr.sec td { padding-top: 14px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.cost td.up { color: var(--bad); } .cost td.down { color: var(--ok); }
@media (max-width: 520px) { .cost td { padding: 5px 3px; font-size: 12.5px; } .cost tr.sec td { white-space: normal; } }

.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.shots a { display: block; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.shots img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); }
.files a { display: block; padding: 3px 0; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.empty { padding: 30px 10px; text-align: center; color: var(--faint); }
</style>
</head>
<body>
<header>
  <select id="epic" aria-label="Epic"></select>
  <div class="title"><b id="title">Loop Watch</b><span id="state"></span></div>
  <div class="meta" id="meta"></div>
</header>
<section id="alerts"></section>
<main>
  <div class="col">
    <section id="stats"></section>
    <section id="running"></section>
    <section id="boardwrap">
      <nav class="board" id="board"></nav>
      <section class="panel" id="detail"></section>
    </section>
  </div>
  <div class="col">
    <section class="panel" id="progress"></section>
    <section class="panel" id="plan"></section>
    <section class="panel" id="recent"></section>
  </div>
</main>
<script>
"use strict";
const POLL_MS = 3000;
const ORDER = [["running", "Running"], ["stuck", "Stuck"], ["waiting", "Waiting"], ["landed", "Landed"], ["done", "Done before this run"]];
const ui = { epic: null, ticket: null, tab: "activity", agent: null, follow: true, view: null, feed: null, report: null };

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const pill = (text, kind) => h("span", { class: `pill ${kind || text}` }, text);
const money = (n) => (typeof n === "number" ? `$${n.toFixed(2)}` : "");
function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return `${Math.round(s)}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}
function span(fromIso, toIso) {
  if (!fromIso) return "";
  const m = Math.round(((toIso ? Date.parse(toIso) : Date.now()) - Date.parse(fromIso)) / 60000);
  return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
}
const clock = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "");
const fileUrl = (rel) => `/files/${ui.epic}/${rel.split("/").map(encodeURIComponent).join("/")}`;
async function getJson(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${res.status} ${url}`);
  return res.json();
}

// --- Routing: #/<Epic>/<ticket> ---
function readHash() {
  const [epic, ticket] = location.hash.replace(/^#\/?/, "").split("/");
  ui.epic = epic || null;
  ui.ticket = ticket || null;
}
function go(epic, ticket) {
  const hash = `#/${epic || ""}${ticket ? `/${ticket}` : ""}`;
  if (location.hash !== hash) location.hash = hash; else route();
}
window.addEventListener("hashchange", route);

async function route() {
  const before = `${ui.epic}/${ui.ticket}`;
  readHash();
  if (`${ui.epic}/${ui.ticket}` !== before) { ui.agent = null; ui.feed = null; }
  await refresh();
}

// --- Data ---
async function refresh() {
  let epics = [];
  try { epics = await getJson("/api/epics"); } catch { return; }
  const select = document.getElementById("epic");
  select.replaceChildren(...epics.map((e) => h("option", { value: e.key, selected: e.key === ui.epic }, `${e.running ? "● " : ""}${e.key}`)));
  select.onchange = () => go(select.value, null);
  if (!epics.length) {
    document.getElementById("detail").replaceChildren(h("div", { class: "empty" }, "No runs on this host yet. `loop start <Epic key>` starts one."));
    return;
  }
  if (!ui.epic || !epics.some((e) => e.key === ui.epic)) { go(epics[0].key, null); return; }
  try { ui.view = await getJson(`/api/epic/${ui.epic}`); } catch { return; }
  render();
}

function render() {
  const v = ui.view;
  document.title = `${v.key} ${v.state} · Loop Watch`;
  document.getElementById("title").textContent = `${v.key}${v.summary ? ` · ${v.summary}` : ""}`;
  const stateLabel = v.state === "stopped" && v.stop_reason ? `stopped: ${v.stop_reason}` : v.state;
  document.getElementById("state").replaceChildren(
    v.state === "running" ? h("span", { class: "dot live" }) : "", " ", pill(stateLabel, v.state));
  document.getElementById("meta").replaceChildren(
    v.started ? h("span", {}, `Started ${when(v.started)}`) : "",
    v.started ? h("span", {}, `${span(v.started, v.state === "running" ? null : v.updated)} ${v.state === "running" ? "so far" : "long"}`) : "",
    h("span", { class: "faint" }, `last step ${ago(v.updated)}`),
    v.pr_url ? h("a", { href: v.pr_url, target: "_blank" }, "Epic PR") : "");

  const alerts = v.tickets.filter((t) => t.column === "stuck").map((t) =>
    h("div", { class: "alert" }, h("b", {}, `${t.key} is stuck. `), (t.stuck_reason || "The ticket is flagged.").slice(0, 300)));
  if (v.state === "stopped") alerts.unshift(h("div", { class: "alert" }, h("b", {}, "The run stopped: "), v.stop_reason));
  document.getElementById("alerts").replaceChildren(...alerts);

  renderStats(v);
  renderPlan(v);
  renderRunning(v);
  renderProgress(v);
  renderRecent(v);
  renderBoard(v);
  renderDetail(v);
}

// --- Overview: figures from the logs only ---
const PROGRESS = [["landed", "Landed", "seg-landed"], ["running", "Running", "seg-running"], ["stuck", "Stuck", "seg-stuck"], ["waiting", "Waiting", "seg-waiting"]];
const WINDOWS = [["five_hour", "Five-hour"], ["seven_day", "Seven-day"]];
const STEPS = [["agent", "Agent"], ["ticket-gate", "Ticket gate"], ["code-review", "Code review"], ["ui-review", "UI review"], ["land", "Land"]];
const points = (n) => (typeof n === "number" ? `${n.toFixed(1)}` : "-");
const when = (iso) => (iso ? new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "");
const resetAt = (epoch) => {
  const d = new Date(epoch * 1000);
  const sameDay = d.toDateString() === new Date().toDateString();
  return d.toLocaleString([], sameDay ? { hour: "numeric", minute: "2-digit" } : { weekday: "short", hour: "numeric", minute: "2-digit" });
};
const duration = (minutes) => (minutes < 60 ? `${Math.round(minutes)}` : `${Math.floor(minutes / 60)}h ${Math.round(minutes % 60)}`);

function stat(label, value, unit, sub, extra) {
  return h("div", { class: "panel stat" }, h("div", { class: "label" }, label),
    h("div", { class: "value" }, value, unit ? h("small", {}, ` ${unit}`) : ""), h("div", { class: "sub" }, sub), extra || "");
}

function renderStats(v) {
  const s = v.stats;
  const total = Math.max(s.total, 1);
  const bar = h("div", { class: "segbar", title: PROGRESS.map(([k, label]) => `${label} ${s[k]}`).join(", ") },
    PROGRESS.map(([k, , cls]) => (s[k] ? h("span", { class: cls, style: `width:${(s[k] / total) * 100}%` }) : "")));
  const each = v.plan.per_landed || {};
  document.getElementById("stats").replaceChildren(
    stat("Tickets", `${s.landed}`, `of ${s.total} landed`, `${s.running} running · ${s.stuck} stuck · ${s.waiting} waiting`, bar),
    stat("First-pass rate", s.first_pass_rate === null ? "-" : `${Math.round(s.first_pass_rate * 100)}%`, "",
      "landed on the first ticket gate"),
    stat("Time to land", s.median_land_minutes === null ? "-" : duration(s.median_land_minutes),
      s.median_land_minutes === null ? "" : "min", "median per ticket"),
    stat("Plan points", points(each.five_hour), each.five_hour === undefined ? "" : "pt",
      each.seven_day === undefined ? "five-hour, per landed ticket" : `five-hour per landed ticket · ${points(each.seven_day)} pt seven-day`));
}

function renderPlan(v) {
  const p = v.plan;
  const meters = WINDOWS.filter(([w]) => p.now[w]).map(([w, label]) => {
    const now = p.now[w];
    const pct = Math.round(now.utilization * 100);
    const tone = pct >= 90 ? "bad" : pct >= 70 ? "warn" : "";
    const reset = now.resets_at ? (now.past ? `Reset at ${resetAt(now.resets_at)}. The run has not read the meter since.` : `Resets at ${resetAt(now.resets_at)}`) : "";
    return h("div", { class: "meter" },
      h("div", { class: "row" }, h("span", { class: "name" }, label), h("span", { class: "pct" }, `${pct}%`)),
      h("div", { class: "track" }, h("div", { class: `fill ${tone}`, style: `width:${Math.min(pct, 100)}%` })),
      h("div", { class: "when" }, reset));
  });
  const figures = WINDOWS.filter(([w]) => p.used[w] !== undefined).map(([w, label]) =>
    h("div", {}, h("b", {}, `${points(p.used[w])} pt`), `${label} points this run`));
  const fits = WINDOWS.filter(([w]) => p.fits[w] !== undefined).map(([w, label]) =>
    h("div", {}, h("b", {}, `${p.fits[w]}`), `more tickets fit in the ${label.toLowerCase()} window`));
  document.getElementById("plan").replaceChildren(
    h("div", { class: "card-head" }, h("h2", {}, "Plan usage")),
    h("div", { class: "card-body" },
      meters.length ? meters : h("div", { class: "muted" }, "No agent run of this run has logged the plan meter yet."),
      figures.length || fits.length ? h("div", { class: "figures" }, figures, fits) : "",
      h("div", { class: "note" }, "The meter covers all use of the account, not only the loop.")));
}

function renderRunning(v) {
  const running = v.tickets.filter((t) => t.column === "running");
  const cards = running.map((t) => {
    const step = t.step || { name: "agent", since: null, paused: false };
    const at = STEPS.findIndex(([k]) => k === step.name);
    return h("button", { class: "runcard", onclick: () => go(ui.epic, t.key) },
      h("div", { class: "top" }, h("span", { class: step.paused ? "dot" : "dot live" }), h("span", { class: "key" }, t.key),
        step.paused ? pill("paused", "paused") : ""),
      h("div", { class: "sum" }, t.summary || ""),
      h("div", { class: "stepper" }, STEPS.map(([k, label], i) =>
        h("div", { class: `st${i < at ? " past" : ""}${i === at ? " now" : ""}${i === at && step.paused ? " paused" : ""}` }, label))),
      h("div", { class: "elapsed" }, step.since ? `${STEPS[at] ? STEPS[at][1] : step.name} for ${span(step.since, null)}${step.paused ? ", waiting for the usage limit to reset" : ""}` : ""),
      t.recent && t.recent.length ? h("div", { class: "lines" }, t.recent.map((item) =>
        h("div", { class: "line" }, h("span", { class: "name" }, item.kind === "tool" ? item.tool : "Text"),
          h("span", { class: "what" }, item.summary || item.text || "")))) : "");
  });
  document.getElementById("running").replaceChildren(
    h("div", { class: "card-head", style: "padding:0 2px 8px" }, h("h2", {}, `Running now · ${running.length}`)),
    cards.length ? h("div", { class: "runcards" }, cards) : h("div", { class: "panel idle-note" }, v.state === "running" ? "No ticket runs at the moment." : "The run is not running."));
}

function renderProgress(v) {
  const s = v.stats;
  const total = Math.max(s.total, 1);
  let at = 0;
  const stops = PROGRESS.map(([k, , cls]) => {
    const color = { "seg-landed": "var(--ok)", "seg-running": "var(--run)", "seg-stuck": "var(--bad)", "seg-waiting": "color-mix(in srgb, var(--warn) 55%, var(--line))" }[cls];
    const from = at; at += (s[k] / total) * 100;
    return `${color} ${from}% ${at}%`;
  });
  const ring = h("div", { class: "ring", style: `background: conic-gradient(${stops.join(", ")}, var(--code-bg) ${at}% 100%)` },
    h("div", { class: "hole" }, h("div", {}, h("b", {}, `${s.landed}/${s.total}`), h("span", {}, "landed"))));
  const legend = h("div", { class: "legend" }, PROGRESS.map(([k, label, cls]) =>
    h("div", {}, h("i", { class: cls }), label, h("b", {}, String(s[k])))));
  document.getElementById("progress").replaceChildren(
    h("div", { class: "card-head" }, h("h2", {}, "Progress")),
    h("div", { class: "card-body" }, h("div", { class: "progress" }, ring, legend)));
}

function renderRecent(v) {
  const events = v.events.slice(-8).reverse();
  document.getElementById("recent").replaceChildren(
    h("div", { class: "card-head" }, h("h2", {}, "Recent activity")),
    h("div", { class: "card-body" }, events.length ? h("ul", { class: "events" }, events.map((e) =>
      h("li", {}, h("span", { class: "t" }, clock(e.time)),
        h("span", { class: "w", title: e.detail || "" }, h("span", { class: "k" }, e.ticket), e.step),
        pill(e.result, e.result)))) : h("div", { class: "muted" }, "No steps yet.")));
}

function renderBoard(v) {
  const groups = [h("button", { class: `card epic${ui.ticket ? "" : " selected"}`, onclick: () => go(v.key, null) },
    h("div", { class: "row" }, h("b", {}, "Whole run"), h("span", { class: "faint" }, `${v.events.length} steps`)))];
  for (const [column, label] of ORDER) {
    const tickets = v.tickets.filter((t) => t.column === column);
    if (!tickets.length) continue;
    groups.push(h("div", { class: "group" }, h("h3", {}, `${label} · ${tickets.length}`), tickets.map((t) => card(t))));
  }
  document.getElementById("board").replaceChildren(...groups);
}

function card(t) {
  const waits = (t.blockers || []).filter((b) => !b.done).map((b) => b.key);
  return h("button", { class: `card${ui.ticket === t.key ? " selected" : ""}`, onclick: () => go(ui.epic, t.key) },
    h("div", { class: "row" }, t.column === "running" ? h("span", { class: "dot live" }) : "", h("span", { class: "key" }, t.key)),
    h("div", { class: "sum" }, t.summary || ""),
    h("div", { class: "sub" },
      t.last ? h("span", {}, t.last.step === t.last.result ? t.last.step : `${t.last.step} ${t.last.result}`) : "",
      t.last ? h("span", { class: "faint" }, ago(t.last.time)) : "",
      t.cost ? h("span", { title: "list price (API)" }, `${money(t.cost)} list`) : "",
      waits.length ? h("span", {}, `waits on ${waits.join(", ")}`) : ""));
}

// --- Detail ---
function renderDetail(v) {
  const t = ui.ticket ? v.tickets.find((x) => x.key === ui.ticket) : null;
  const panel = document.getElementById("detail");
  const agents = t ? t.agents : v.epic_agents;
  const shots = t ? t.screenshots : [];
  const files = t ? t.files : v.epic_files;
  const tabs = [["activity", `Activity${agents.length ? ` · ${agents.length} runs` : ""}`], ["steps", "Steps"]];
  if (shots.length) tabs.push(["shots", `Screenshots · ${shots.length}`]);
  if (files.length) tabs.push(["files", `Files · ${files.length}`]);
  if (!t) tabs.push(["cost", "Cost"]);
  if (!tabs.some(([k]) => k === ui.tab)) ui.tab = "activity";

  const head = h("div", { class: "head" },
    h("div", { class: "row" }, h("h2", {}, t ? [t.key, t.summary].filter(Boolean).join(" · ") : `${v.key} · the whole run`), " ", t ? pill(t.column) : ""),
    t && t.stuck_reason ? h("div", { class: "reason" }, t.stuck_reason) : "",
    v.branch && !t ? h("div", { class: "muted mono" }, v.branch) : "");
  const tabBar = h("div", { class: "tabs" }, tabs.map(([k, label]) =>
    h("button", { class: ui.tab === k ? "on" : "", onclick: () => { ui.tab = k; renderDetail(ui.view); } }, label)));

  // The activity feed keeps its rows between polls, so an open row stays open.
  const keep = ui.feed && ui.tab === "activity" && panel.contains(ui.feed.root);
  let body;
  if (ui.tab === "activity") body = keep ? ui.feed.wrap : activityView(t ? t.key : v.key, agents, t ? t.column === "running" : v.state === "running");
  else if (ui.tab === "steps") body = stepsView(v.events.filter((e) => !t || e.ticket === t.key));
  else if (ui.tab === "cost") body = costView(v.key);
  else if (ui.tab === "shots") body = h("div", { class: "body shots" }, shots.map((s) =>
    h("a", { href: fileUrl(s), target: "_blank" }, h("img", { src: fileUrl(s), loading: "lazy", alt: s }), s.split("/").pop())));
  else body = h("div", { class: "body files" }, files.map((f) => h("a", { href: fileUrl(f), target: "_blank" }, f.replace(/^runs\/[^/]+\//, ""))));
  if (keep) { panel.firstChild.replaceWith(head); panel.children[1].replaceWith(tabBar); if (ui.feed.live) pollFeed(); return; }
  panel.replaceChildren(head, tabBar, body);
}

function stepsView(events) {
  if (!events.length) return h("div", { class: "empty" }, "No steps yet.");
  return h("div", { class: "body" }, h("table", { class: "steps" }, h("tbody", {}, events.slice().reverse().map((e) =>
    h("tr", {},
      h("td", { class: "t" }, clock(e.time)),
      h("td", { class: "k" }, e.ticket),
      h("td", {}, h("b", {}, e.step), " ", pill(e.result, e.result)),
      h("td", { class: "d" }, e.cost !== undefined ? `${money(e.cost)} list price (API) · ${e.turns} turns ` : "",
        e.log ? h("a", { href: fileUrl(e.log), target: "_blank" }, "log") : "", " ", e.log ? "" : (e.detail || "").slice(0, 400)))))));
}

// --- Cost: the latest run against the run before it (`loop report`) ---
function costView(key) {
  const wrap = h("div", { class: "body" });
  const fill = (report) => wrap.replaceChildren(report ? costTable(report) : h("div", { class: "empty" }, "No run of this Epic has a cost yet."));
  const cached = ui.report && ui.report.key === key;
  if (cached) fill(ui.report.data); else wrap.append(h("div", { class: "empty" }, "Loading..."));
  if (!cached || Date.now() - ui.report.at > 30000) {
    getJson(`/api/report/${key}`)
      .then((data) => { ui.report = { key, data, at: Date.now() }; fill(data); })
      .catch(() => { ui.report = { key, data: null, at: Date.now() }; fill(null); });
  }
  return wrap;
}

function figure(kind, n) {
  if (n === null || n === undefined) return "-";
  if (kind === "money") return money(n);
  if (kind === "minutes") return `${Math.round(n)} min`;
  if (kind === "points") return `${n.toFixed(1)} pt`;
  if (kind === "tokens") return n.toLocaleString();
  return String(n);
}

function costTable(report) {
  const before = report.previous ? `${report.previous.epic} ${(report.previous.started || "").slice(0, 10)}` : "No earlier run";
  const rows = [];
  let section = "";
  for (const row of report.rows) {
    if (row.section !== section) {
      section = row.section;
      const top = rows.length === 0;
      rows.push(h("tr", { class: "sec" }, h("td", {}, section), h("td", { class: "n" }, top ? before : ""),
        h("td", { class: "n" }, top ? "This run" : ""), h("td", { class: "n" }, top ? "Change" : "")));
    }
    const pct = typeof row.change === "number";
    const change = pct ? `${row.change > 0 ? "+" : ""}${row.change}%` : row.change || "";
    const tone = (row.kind === "money" || row.kind === "points") && pct && row.change !== 0 ? (row.change < 0 ? "down" : "up") : "";
    const n = row.kind === "text" ? "n text" : "n";
    rows.push(h("tr", {}, h("td", {}, row.label), h("td", { class: n }, figure(row.kind, row.previous)),
      h("td", { class: n }, figure(row.kind, row.current)), h("td", { class: `n ${tone}` }, change)));
  }
  return h("table", { class: "steps cost" }, h("tbody", {}, rows));
}

// --- Activity ---
function activityView(key, agents, live) {
  if (!agents.length) return h("div", { class: "empty" }, "No agent run yet.");
  if (!ui.agent || !agents.some((a) => a.number === ui.agent)) ui.agent = agents[agents.length - 1].number;
  const root = h("div", { class: "feed" });
  const follow = h("input", { type: "checkbox", checked: ui.follow, onchange: (e) => { ui.follow = e.target.checked; } });
  const wrap = h("div", { class: "body" },
    h("div", { class: "runs" },
      agents.map((a) => h("button", { class: a.number === ui.agent ? "on" : "", onclick: () => { ui.agent = a.number; ui.feed = null; renderDetail(ui.view); } }, `Run ${a.number}`)),
      h("label", {}, follow, "Follow")),
    root);
  ui.feed = { key, wrap, root, agent: ui.agent, offset: 0, rows: {}, live: live && ui.agent === agents[agents.length - 1].number, busy: false };
  pollFeed();
  return wrap;
}

async function pollFeed() {
  const feed = ui.feed;
  if (!feed || feed.busy) return;
  feed.busy = true;
  try {
    for (;;) {
      const data = await getJson(`/api/agent/${ui.epic}/${feed.key}/${feed.agent}?offset=${feed.offset}`);
      if (feed !== ui.feed) return;
      const root = feed.root;
      const atEnd = feed.offset === 0 || root.scrollHeight - root.scrollTop - root.clientHeight < 40;
      for (const item of data.items) addItem(feed, item);
      feed.offset = data.offset;
      if (data.items.length && ui.follow && atEnd) root.scrollTop = root.scrollHeight;
      if (data.offset >= data.size) break;
    }
  } catch { /* The next poll tries again. */ } finally { feed.busy = false; }
}

function addItem(feed, item) {
  const sub = item.parent ? " sub" : "";
  if (item.kind === "output") {
    const target = feed.rows[item.id];
    if (!target) return;
    target.mark.className = `mark ${item.error ? "bad" : "ok"}`;
    target.mark.textContent = item.denied ? "⛔" : item.error ? "✗" : "✓";
    if (item.denied) target.row.classList.add("denied");
    if (item.text) target.detail.append(`\n\n── result ──\n${item.text}`);
    return;
  }
  let row = null;
  if (item.kind === "init") row = h("div", { class: "divider" }, `Session started${item.model ? ` · ${item.model}` : ""}`);
  else if (item.kind === "result") row = h("div", { class: "divider" }, `Turn ended${item.error ? " with an error" : ""} · ${money(item.total_cost_usd)} list price (API) · ${item.num_turns ?? "?"} turns · ${Math.round((item.duration_ms || 0) / 60000)} min`);
  else if (item.kind === "text") row = h("div", { class: `item${sub}` }, h("div", { class: "text", onclick: (e) => e.currentTarget.classList.toggle("open") }, item.text));
  else if (item.kind === "status") {
    row = h("div", { class: `status ${item.status}` }, h("b", {}, item.status === "done" ? "Done. " : "Blocked. "), item.text,
      item.decisions?.length ? h("ul", {}, item.decisions.map((d) => h("li", {}, d))) : "");
  } else if (item.kind === "tool") {
    const mark = h("span", { class: "mark wait" }, "…");
    const detail = h("pre", { class: "detail", hidden: true }, item.detail || item.summary);
    const line = h("div", { class: "tool", onclick: () => { detail.hidden = !detail.hidden; } },
      h("span", { class: "name" }, item.tool), h("span", { class: "what", title: item.summary }, item.summary), mark);
    row = h("div", { class: `item${sub}` }, line, detail);
    feed.rows[item.id] = { row, mark, detail };
  }
  if (row) feed.root.append(row);
}

route();
setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
</script>
</body>
</html>
