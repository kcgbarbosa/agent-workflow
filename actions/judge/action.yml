name: judge
description: >-
  The gate's UI judge. It reads the screenshot folder that the repo's browser tests write, `screenshot-diff/` at the repo root,
  with one folder per step and two kinds of step. A changed step holds `baseline.png`, `new.png`, and `diff.png`: the tests
  leave out a change below their tolerance, and the pull request commits the new screenshots as the baselines. A rated step
  holds only `new.png`, for a screen whose baseline would not stay stable, and the judge asks if that screen shows a fault of
  the list rather than a change. Each step holds `step.json`, with `line`, the step's ticket line, and `path`, the
  screenshot's path in the repo. One model call per step, with no tools, answers blocking, minor, or fine. Only a fault on
  `loop.toml [ui] blocking` can block. A blocking verdict fails the step and comments the step, the sentence, and the two
  images, or the one image of a rated step. Minor verdicts collect in one checklist comment.
inputs:
  claude_code_oauth_token:
    description: The Claude Code token of the plan the judge bills. One of the two tokens is needed.
    required: false
  anthropic_api_key:
    description: The API key the judge bills instead of a plan.
    required: false
  model:
    description: The model of each call.
    default: claude-opus-5-5
  effort:
    description: The effort of each call. One look at one or three images needs little.
    default: low
runs:
  using: composite
  steps:
    - shell: bash
      run: python3 "$GITHUB_ACTION_PATH/judge.py"
      env:
        GH_TOKEN: ${{ github.token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        SCREENSHOTS: screenshot-diff
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        JUDGE_MODEL: ${{ inputs.model }}
        JUDGE_EFFORT: ${{ inputs.effort }}
