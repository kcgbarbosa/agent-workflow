name: judge
description: >-
  The gate's UI judge. It reads the screenshot folder that the repo's browser tests write, `screenshot-diff/` at the repo root,
  with two kinds of step. A rated step is a flat pair at the top of the folder, `<step>.png` and `<step>.json`, as the tests
  write it, and the judge asks if that screen shows a fault of the list rather than a change. A step folder holds `new.png`,
  and a changed step adds `baseline.png` and `diff.png`: the tests leave out a change below their tolerance, and the pull
  request commits the new screenshots as the baselines. A folder with only `new.png` is a rated step too. A step folder holds
  `step.json`. Each JSON holds `line`, the step's ticket line, and can hold `path`, the screenshot's path in the repo, for the
  images of a comment. A PNG with no JSON beside it is not a step, and the judge logs its name. Each model call, with no
  tools, answers blocking, minor, or fine for each of its steps. The rated steps go in batches of up to `batch_size` images
  in one call, each image with its step name and ticket line, and the answer names each step. A step the answer leaves out
  is minor, with a note that the judge gave no verdict. A changed step keeps one call of its own for its three images. Up
  to 4 calls run at a time. Only a fault on `loop.toml [ui] blocking` can block. A blocking verdict fails the step and
  comments the step, the sentence, and the two images, or the one image of a rated step. Minor verdicts collect in one
  checklist comment.
inputs:
  claude_code_oauth_token:
    description: The Claude Code token of the plan the judge bills. One of the two tokens is needed.
    required: false
  anthropic_api_key:
    description: The API key the judge bills instead of a plan.
    required: false
  model:
    description: The model of each call.
    default: claude-opus-5-5
  effort:
    description: The effort of each call. One look at a batch of screens, or at one changed step, needs little.
    default: low
  batch_size:
    description: The most rated steps, one image each, that share one call.
    default: "10"
runs:
  using: composite
  steps:
    - shell: bash
      run: python3 "$GITHUB_ACTION_PATH/judge.py"
      env:
        GH_TOKEN: ${{ github.token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        SCREENSHOTS: screenshot-diff
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        JUDGE_MODEL: ${{ inputs.model }}
        JUDGE_EFFORT: ${{ inputs.effort }}
        JUDGE_BATCH_SIZE: ${{ inputs.batch_size }}
