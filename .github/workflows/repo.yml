name: repo

# The tests and the lint run in the gate's `make check`. This workflow keeps the check that reads the pull request.
on:
  pull_request:

# A newer push to a PR cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  co-authors:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the step can list the pull request commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The body and SHAs go in through env, so a crafted body cannot inject shell code.
      - run: .github/scripts/check-co-authors.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
