name: loop

on:
  pull_request:
    paths: ["loop/**", "agents/**", "skills/setup-loop/loop.md", ".github/workflows/loop.yml"]
  push:
    branches: [main]
    paths: ["loop/**", "agents/**", "skills/setup-loop/loop.md", ".github/workflows/loop.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run pytest
