name: gate

# The shared merge gate. A repo calls it from the pull-request workflow that setup-repo writes, so every repo runs the same checks.
# The repo's own `make check` decides what green means. The fuzz job starts beside it, so its wait does not add to the check's.
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label of every job.
        type: string
        default: ubuntu-latest
      check:
        description: The command that runs everything the repo needs green.
        type: string
        default: make check
      docs-check:
        description: The command that a docs-only pull request runs instead.
        type: string
        default: make check-docs
      docs-only:
        description: Run the docs command when the pull request changes only `*.md` files and `docs/`.
        type: boolean
        default: true
      fuzz-model:
        description: The fuzz job's model. gate.toml [fuzz] overrides it.
        type: string
        default: claude-opus-5-5
      fuzz-effort:
        description: The fuzz job's effort. gate.toml [fuzz] overrides it.
        type: string
        default: high
      fuzz-skip:
        description: Path globs the fuzz job skips, split on whitespace. gate.toml [fuzz] `skip` overrides them.
        type: string
        default: "*.md docs/* *.lock package-lock.json pnpm-lock.yaml yarn.lock"
    # The fuzz job bills one of the two: a Claude plan through CLAUDE_CODE_OAUTH_TOKEN, or the API through ANTHROPIC_API_KEY.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: The Claude Code token of the plan the fuzz job bills.
        required: false
      ANTHROPIC_API_KEY:
        description: The API key the fuzz job bills instead of a plan.
        required: false
      CHECK_ENV:
        description: Values the check command and the fuzz job's stack need, one `NAME=value` per line, each masked.
        required: false

jobs:
  # Works out from the diff whether the pull request is docs-only, which the check and the fuzz job both need.
  paths:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.paths.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        if: inputs.docs-only
        with:
          fetch-depth: 0
      # The checkout is the pull request merged into its base, so the first parent is the base.
      - id: paths
        if: inputs.docs-only
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [ -n "$changed" ] && ! grep -qvE '(\.md$|^docs/)' <<<"$changed"; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi

  # A failed `paths` leaves docs-only unset, so the check and the fuzz job run in full and a skip never passes the gate.
  check:
    needs: paths
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A squash merge carries the title, the body, and the branch's trailers onto the default branch, so none may credit an agent.
      # It is a step of this job because `gate / check` is already required in every repo and runs on a docs-only pull request too.
      # The title and the body come from GitHub, since a re-run keeps the event's old copy and an edit starts no run.
      # Everything the pull request wrote goes in through env, and each line found prints after a prefix, so none runs as shell code or a workflow command.
      - name: attribution
        run: |
          pattern='^[[:space:]]*co-authored-by:.*(claude|anthropic)|generated (with|by) \[?claude code|claude\.ai/code/session'
          found=0
          check() {
            local hits hit
            if hits=$(tr -d '\r' | grep -aiE "$pattern"); then
              while IFS= read -r hit; do
                printf '%s: %s\n' "$1" "$hit"
              done <<<"$hits"
              found=1
            fi
          }
          text=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.title, (.body // "")')
          check "Title or body" <<<"$text"
          # Only the pull request's own commits. Older commits on the default branch already carry trailers.
          commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          for sha in $commits; do
            check "Commit $(git log -1 --format='%h %s' "$sha")" <<<"$(git log -1 --format=%B "$sha")"
          done
          if [ "$found" = 1 ]; then
            echo "Agent attribution found. Reword the commits, edit the title or the body, then re-run this job."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # The repo's pinned toolchain, so the runner uses the same versions as the T14.
      - if: hashFiles('mise.toml', '.mise.toml', '.tool-versions', '.config/mise.toml') != ''
        uses: jdx/mise-action@v5
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The command goes in through env, so it runs as the caller wrote it.
      # Each CHECK_ENV value is masked before the command prints anything, and only the command gets them. A `%` is escaped, or the mask would miss it.
      - run: |
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            line=${line%$'\r'}
            [[ -z $line || $line == \#* ]] && continue
            if [[ ! $line =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]]; then
              echo "::error::CHECK_ENV line $n is not NAME=value"
              exit 1
            fi
            name=${BASH_REMATCH[1]} value=${BASH_REMATCH[2]}
            [[ $value =~ ^\"(.*)\"$ || $value =~ ^\'(.*)\'$ ]] && value=${BASH_REMATCH[1]}
            [ -n "$value" ] && echo "::add-mask::${value//%/%25}"
            export "$name=$value"
          done <<<"$CHECK_ENV"
          unset CHECK_ENV
          bash -c "$COMMAND"
        env:
          COMMAND: ${{ needs.paths.outputs.docs-only == 'true' && inputs.docs-check || inputs.check }}
          CHECK_ENV: ${{ secrets.CHECK_ENV }}

  # A docs-only pull request skips the fuzz job, and a skipped job reports success. It gets the check's runner, toolchain,
  # and CHECK_ENV, since the adversaries attack the stack the check runs.
  fuzz:
    needs: paths
    if: ${{ !cancelled() && needs.paths.outputs.docs-only != 'true' }}
    runs-on: ${{ inputs.runner }}
    # Adversaries on a real stack take longer than a review. Without a limit, a stalled run holds the merge for 6 hours.
    timeout-minutes: 60
    # A read-only token, and no step of the job reads it, so the adversaries and their reproductions find no token
    # that can write to the pull request. The `fuzz-report` job posts the review.
    permissions:
      contents: read
    steps:
      # No token stays in the checkout's git config, so the adversaries reach GitHub with none.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The gate's own commit, so the actions match the workflow that calls them.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gate
          persist-credentials: false
      - if: hashFiles('mise.toml', '.mise.toml', '.tool-versions', '.config/mise.toml') != ''
        uses: jdx/mise-action@v5
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      - uses: ./.gate/actions/fuzz
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          check_env: ${{ secrets.CHECK_ENV }}
          model: ${{ inputs.fuzz-model }}
          effort: ${{ inputs.fuzz-effort }}
          skip: ${{ inputs.fuzz-skip }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-review
          path: ${{ runner.temp }}/fuzz-review.json
          if-no-files-found: ignore
          retention-days: 7

  # Posts the fuzz job's review comment. It checks out nothing and runs none of the pull request's code, so the write
  # token stays out of reach of the adversaries.
  fuzz-report:
    needs: fuzz
    if: ${{ !cancelled() && needs.fuzz.result != 'skipped' }}
    runs-on: ${{ inputs.runner }}
    permissions:
      pull-requests: write
    steps:
      - id: review
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fuzz-review
      - if: steps.review.outcome == 'success' && hashFiles('fuzz-review.json') != ''
        # The file comes from the job the adversaries run in, so only its body is taken.
        run: |
          jq --arg head "$HEAD_SHA" '{commit_id: $head, event: "COMMENT", body}' fuzz-review.json |
            gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input - > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
