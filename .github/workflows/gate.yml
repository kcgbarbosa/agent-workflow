name: gate

# The shared merge gate. A repo calls it from the pull-request workflow that setup-repo writes, so every repo runs the same checks.
# The repo's own `make check` decides what green means. The fuzz job starts beside it, so its wait does not add to the check's.
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label of every job.
        type: string
        default: ubuntu-latest
      check:
        description: The command that runs everything the repo needs green.
        type: string
        default: make check
      docs-check:
        description: The command that a docs-only pull request runs instead.
        type: string
        default: make check-docs
      docs-only:
        description: Run the docs command when the pull request changes only `*.md` files and `docs/`.
        type: boolean
        default: true
      fuzz-model:
        description: The fuzz job's model. loop.toml [fuzz] overrides it.
        type: string
        default: claude-opus-5-5
      fuzz-effort:
        description: The fuzz job's effort. loop.toml [fuzz] overrides it.
        type: string
        default: high
      fuzz-skip:
        description: Path globs the fuzz job skips, split on whitespace. loop.toml [fuzz] `skip` overrides them.
        type: string
        default: "*.md docs/* *.lock package-lock.json pnpm-lock.yaml yarn.lock"
    # The fuzz job bills one of the two: a Claude plan through CLAUDE_CODE_OAUTH_TOKEN, or the API through ANTHROPIC_API_KEY.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: The Claude Code token of the plan the fuzz job bills.
        required: false
      ANTHROPIC_API_KEY:
        description: The API key the fuzz job bills instead of a plan.
        required: false
      CHECK_ENV:
        description: Values the check command and the fuzz job's stack need, one `NAME=value` per line, each masked.
        required: false

jobs:
  # Works out from the diff whether the pull request is docs-only, which the check and the fuzz job both need.
  paths:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.paths.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        if: inputs.docs-only
        with:
          fetch-depth: 0
      # The checkout is the pull request merged into its base, so the first parent is the base.
      - id: paths
        if: inputs.docs-only
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [ -n "$changed" ] && ! grep -qvE '(\.md$|^docs/)' <<<"$changed"; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi

  # A failed `paths` leaves docs-only unset, so the check and the fuzz job run in full and a skip never passes the gate.
  check:
    needs: paths
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The repo's pinned toolchain, so the runner uses the same versions as the T14.
      - if: hashFiles('mise.toml', '.mise.toml', '.tool-versions', '.config/mise.toml') != ''
        uses: jdx/mise-action@v5
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The command goes in through env, so it runs as the caller wrote it.
      # Each CHECK_ENV value is masked before the command prints anything, and only the command gets them. A `%` is escaped, or the mask would miss it.
      - run: |
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            line=${line%$'\r'}
            [[ -z $line || $line == \#* ]] && continue
            if [[ ! $line =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]]; then
              echo "::error::CHECK_ENV line $n is not NAME=value"
              exit 1
            fi
            name=${BASH_REMATCH[1]} value=${BASH_REMATCH[2]}
            [[ $value =~ ^\"(.*)\"$ || $value =~ ^\'(.*)\'$ ]] && value=${BASH_REMATCH[1]}
            [ -n "$value" ] && echo "::add-mask::${value//%/%25}"
            export "$name=$value"
          done <<<"$CHECK_ENV"
          unset CHECK_ENV
          bash -c "$COMMAND"
        env:
          COMMAND: ${{ needs.paths.outputs.docs-only == 'true' && inputs.docs-check || inputs.check }}
          CHECK_ENV: ${{ secrets.CHECK_ENV }}

  # A docs-only pull request skips the fuzz job, and a skipped job reports success. It gets the check's runner, toolchain,
  # and CHECK_ENV, since the adversaries attack the stack the check runs.
  fuzz:
    needs: paths
    if: ${{ !cancelled() && needs.paths.outputs.docs-only != 'true' }}
    runs-on: ${{ inputs.runner }}
    # Adversaries on a real stack take longer than a review. Without a limit, a stalled run holds the merge for 6 hours.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No token stays in the checkout's git config, so the adversaries reach GitHub with none.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The gate's own commit, so the actions match the workflow that calls them.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gate
          persist-credentials: false
      - if: hashFiles('mise.toml', '.mise.toml', '.tool-versions', '.config/mise.toml') != ''
        uses: jdx/mise-action@v5
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      - uses: ./.gate/actions/fuzz
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          check_env: ${{ secrets.CHECK_ENV }}
          model: ${{ inputs.fuzz-model }}
          effort: ${{ inputs.fuzz-effort }}
          skip: ${{ inputs.fuzz-skip }}
