name: gate

# The shared merge gate. A repo calls it from the pull-request workflow that setup-repo writes, so every repo runs the same checks.
# The repo's own `make check` decides what green means. The review starts beside it, so its wait does not add to the check's.
# A repo with a long check splits it with `checks`, into jobs that run at once, and `check` passes when each of them passes.
# The judge runs after it, for its screenshots.
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label of every job.
        type: string
        default: ubuntu-latest
      check:
        description: The command that runs everything the repo needs green.
        type: string
        default: make check
      checks:
        description: "The repo's check split into jobs that run at once, one `<name>: <command>` on each line. Empty runs `check` as one job."
        type: string
        default: ""
      docs-check:
        description: The command that a docs-only pull request runs instead.
        type: string
        default: make check-docs
      docs-only:
        description: Run the docs command when the pull request changes only `*.md` files and `docs/`.
        type: boolean
        default: true
      review-model:
        description: The review's model. loop.toml [review] overrides it.
        type: string
        default: claude-opus-5-5
      review-effort:
        description: The review's effort. loop.toml [review] overrides it.
        type: string
        default: high
      review-skip:
        description: Path globs the review skips, split on whitespace. loop.toml [review] `skip` overrides them.
        type: string
        default: "*.md docs/* *.lock package-lock.json pnpm-lock.yaml yarn.lock"
    # The review and the judge bill one of the two: a Claude plan through CLAUDE_CODE_OAUTH_TOKEN, or the API through ANTHROPIC_API_KEY.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: The Claude Code token of the plan the review and the judge bill.
        required: false
      ANTHROPIC_API_KEY:
        description: The API key the review and the judge bill instead of a plan.
        required: false
      CHECK_ENV:
        description: Values the check command needs, such as its stack's keys, one `NAME=value` per line. The review and the judge never get them.
        required: false

jobs:
  # Works out from the diff whether the pull request is docs-only, which the check and the review both need.
  paths:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.paths.outputs.docs-only }}
      checks: ${{ steps.checks.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
        if: inputs.docs-only
        with:
          fetch-depth: 0
      # The checkout is the pull request merged into its base, so the first parent is the base.
      - id: paths
        if: inputs.docs-only
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [ -n "$changed" ] && ! grep -qvE '(\.md$|^docs/)' <<<"$changed"; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi
      # The matrix of the `checks` job, as JSON. A docs-only pull request runs its one command in `check` instead.
      - id: checks
        if: inputs.checks != '' && steps.paths.outputs.docs-only != 'true'
        run: |
          checks='[]' n=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            line=${line%$'\r'}
            [[ $line =~ ^[[:space:]]*(#.*)?$ ]] && continue
            if [[ ! $line =~ ^[[:space:]]*([A-Za-z0-9_.-]+):[[:space:]]*(.*[^[:space:]])[[:space:]]*$ ]]; then
              echo "::error::checks line $n is not <name>: <command>"
              exit 1
            fi
            name=${BASH_REMATCH[1]} command=${BASH_REMATCH[2]}
            if jq -e --arg name "$name" 'any(.name == $name)' <<<"$checks" > /dev/null; then
              echo "::error::checks line $n repeats the name $name"
              exit 1
            fi
            checks=$(jq -c --arg name "$name" --arg command "$command" '. + [{name: $name, command: $command}]' <<<"$checks")
          done <<<"$CHECKS"
          if [ "$checks" = '[]' ]; then
            echo "::error::checks has no <name>: <command> line"
            exit 1
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
        env:
          CHECKS: ${{ inputs.checks }}

  # A failed `paths` leaves docs-only unset, so the check and the review run in full and a skip never passes the gate.
  # The job runs the command itself when the repo does not split its check, and on a docs-only pull request.
  # Else it waits on the `checks` jobs, so `gate / check` stays the one result that the loop and the judge read.
  # A failed `paths` then skips the `checks` jobs, and the check fails.
  check:
    needs: [paths, checks]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      screenshots: ${{ steps.screenshots.outputs.screenshots }}
    # The shared steps read these, so they run the same in the `checks` jobs.
    env:
      GATE_RUNS: ${{ inputs.checks == '' || needs.paths.outputs.docs-only == 'true' }}
      GATE_JOB: check
      COMMAND: ${{ needs.paths.outputs.docs-only == 'true' && inputs.docs-check || inputs.check }}
    steps:
      - &checkout
        if: env.GATE_RUNS == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The repo's pinned toolchain, so the runner uses the same versions as the T14.
      - &mise
        if: env.GATE_RUNS == 'true' && hashFiles('mise.toml', '.mise.toml', '.tool-versions', '.config/mise.toml') != ''
        uses: jdx/mise-action@v5
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The command goes in through env, so it runs as the caller wrote it.
      # Each CHECK_ENV value is masked before the command prints anything, and only the command gets them. A `%` is escaped, or the mask would miss it.
      - &run
        if: env.GATE_RUNS == 'true'
        run: |
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            line=${line%$'\r'}
            [[ -z $line || $line == \#* ]] && continue
            if [[ ! $line =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]]; then
              echo "::error::CHECK_ENV line $n is not NAME=value"
              exit 1
            fi
            name=${BASH_REMATCH[1]} value=${BASH_REMATCH[2]}
            [[ $value =~ ^\"(.*)\"$ || $value =~ ^\'(.*)\'$ ]] && value=${BASH_REMATCH[1]}
            [ -n "$value" ] && echo "::add-mask::${value//%/%25}"
            export "$name=$value"
          done <<<"$CHECK_ENV"
          unset CHECK_ENV
          bash -c "$COMMAND"
        env:
          CHECK_ENV: ${{ secrets.CHECK_ENV }}
      - if: env.GATE_RUNS != 'true'
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::A job of checks ended $RESULT, so the check fails."
            exit 1
          fi
        env:
          RESULT: ${{ needs.checks.result }}
      # Each `checks` job uploads its own screenshots, which make one folder here as in the judge.
      - if: env.GATE_RUNS != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: screenshot-diff-*
          merge-multiple: true
          path: screenshot-diff
      # actions/judge/action.yml gives the folder that the repo's browser tests write.
      - &screenshots
        id: screenshots
        run: |
          found=false
          if compgen -G 'screenshot-diff/*/new.png' > /dev/null; then
            found=true
          fi
          for meta in screenshot-diff/*.json; do
            if [ -f "${meta%.json}.png" ]; then
              found=true
            fi
          done
          if [ "$found" = true ]; then
            echo "screenshots=true" >> "$GITHUB_OUTPUT"
          fi
      - &upload
        if: env.GATE_RUNS == 'true' && steps.screenshots.outputs.screenshots == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diff-${{ env.GATE_JOB }}
          path: screenshot-diff/

  # One job for each line of `checks`, all at once. A red one leaves the others running, so its fix sees every failure.
  checks:
    needs: paths
    if: needs.paths.outputs.checks != ''
    name: check (${{ matrix.name }})
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.paths.outputs.checks) }}
    env:
      GATE_RUNS: "true"
      GATE_JOB: ${{ matrix.name }}
      COMMAND: ${{ matrix.command }}
    steps:
      - *checkout
      - *mise
      - *run
      - *screenshots
      - *upload

  # A docs-only pull request skips the review, and a skipped job reports success.
  review:
    needs: paths
    if: ${{ !cancelled() && needs.paths.outputs.docs-only != 'true' }}
    runs-on: ${{ inputs.runner }}
    # A good review takes under 10 minutes. Without a limit, a stalled one holds the merge for 6 hours.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # The gate's own commit, so the actions match the workflow that calls them.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gate
      - uses: ./.gate/actions/review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.review-model }}
          effort: ${{ inputs.review-effort }}
          skip: ${{ inputs.review-skip }}

  # Runs only when a check job uploaded a screenshot diff, and a skipped job reports success.
  judge:
    needs: check
    if: needs.check.outputs.screenshots == 'true'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base, for its loop.toml, so a pull request cannot change what blocks it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshot-diff-*
          merge-multiple: true
          path: screenshot-diff
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gate
      - uses: ./.gate/actions/judge
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
